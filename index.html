<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricbuzz Clone - Final Fixed Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
        .animate-pulse-dot { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-[#121212] text-gray-200 font-sans antialiased">

    <header class="bg-[#004d40] p-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-tight text-white">Cricbuzz Clone</span>
            <span class="bg-[#1b5e20] text-[#81c784] text-[10px] font-bold px-1.5 py-0.5 rounded tracking-wide">RAPIDAPI LIVE</span>
        </div>
        <div class="flex items-center space-x-1 text-xs font-medium bg-[#1e1e1e]/40 px-2 py-1 rounded">
            <span id="sync-status" class="text-[#81c784]">✓ Connected</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4">
        
        <div class="bg-[#1e1e1e] rounded-xl p-5 border border-gray-800 shadow-sm">
            <div class="flex justify-between items-center mb-3">
                <span class="text-[10px] font-bold uppercase tracking-wider bg-red-900/40 text-red-400 px-2 py-0.5 rounded flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse-dot"></span> LIVE STREAM
                </span>
                <span class="text-xs text-zinc-500 font-mono" id="live-over-counter">Overs: --</span>
            </div>
            
            <div class="flex justify-between items-baseline my-4">
                <div class="min-w-0 pr-2">
                    <h2 class="text-xl font-extrabold text-white tracking-tight truncate" id="live-batting-team">Match Update</h2>
                    <p class="text-[11px] text-[#29b6f6] font-medium mt-1 truncate" id="live-status-note">Connecting to commentary data stream...</p>
                </div>
                <div class="text-right flex-shrink-0">
                    <div class="text-3xl font-black text-white tracking-tight" id="live-main-score">--</div>
                </div>
            </div>
        </div>

        <div class="bg-[#1e1e1e] rounded-xl p-4 border border-gray-800 shadow-sm">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Ball-by-Ball Logs</h3>
            <div id="commentary-feed-box" class="space-y-3 max-h-[400px] overflow-y-auto pr-1 divide-y divide-gray-800/60">
                <div class="p-4 text-center text-zinc-500 text-sm">Awaiting API packet response...</div>
            </div>
        </div>

        <div id="debug-terminal" class="hidden bg-zinc-900 border border-red-900/40 p-3 rounded-xl text-xs text-red-400 font-mono"></div>
    </main>

    <script>
        // Your authorized RapidAPI configuration
        const CONFIG = {
            url: "https://cricket-live-line-advance.p.rapidapi.com/matches/87014/innings/2/commentary",
            headers: {
                "x-rapidapi-host": "cricket-live-line-advance.p.rapidapi.com",
                "x-rapidapi-key": "5c86953d66mshe0d3e06701aa1ddp14c43djsn3eac42f75725",
                "Content-Type": "application/json"
            },
            intervalMs: 10000 // Refreshes every 10 seconds
        };

        async function parseCommentaryData() {
            const terminal = document.getElementById('debug-terminal');
            try {
                const response = await fetch(CONFIG.url, {
                    method: "GET",
                    headers: CONFIG.headers
                });

                if (!response.ok) {
                    throw new Error(`API Error ${response.status}`);
                }

                const payload = await response.json();
                console.log("Raw API Payload Received:", payload); // Visible in browser console

                // Foolproof Array Finder: Checks every common layout wrapper used by this API
                let items = [];
                if (Array.isArray(payload)) {
                    items = payload;
                } else if (payload.data && Array.isArray(payload.data)) {
                    items = payload.data;
                } else if (payload.commentary && Array.isArray(payload.commentary)) {
                    items = payload.commentary;
                } else if (payload.response && Array.isArray(payload.response)) {
                    items = payload.response;
                } else if (typeof payload === 'object' && payload !== null) {
                    // If the items are wrapped inside an inner object key, extract them
                    const objectKeys = Object.keys(payload);
                    for (let key of objectKeys) {
                        if (Array.isArray(payload[key])) {
                            items = payload[key];
                            break;
                        }
                    }
                }

                // Fallback: If it's still not an array, check if there's a single match object
                if (items.length === 0 && (payload.score || payload.runs)) {
                    items = [payload]; 
                }

                if (items.length === 0) {
                    document.getElementById('commentary-feed-box').innerHTML = `
                        <div class="text-center py-6 text-zinc-500 text-xs border border-dashed border-zinc-800 rounded-lg">
                            Connected! Awaiting active Innings 2 commentary packets...
                        </div>`;
                    return;
                }

                if (terminal) terminal.classList.add('hidden');

                // 1. Process and Update Top Live Scorecard Header
                const currentBall = items[0];
                
                // Dynamically resolve score variables across different naming conventions
                const scoreDisplay = currentBall.score || currentBall.full_score || 
                                     (currentBall.runs !== undefined ? `${currentBall.runs}/${currentBall.wickets || 0}` : "Live");
                                     
                document.getElementById('live-main-score').innerText = scoreDisplay;
                document.getElementById('live-over-counter').innerText = `Overs: ${currentBall.over || currentBall.overs || '--'}`;
                document.getElementById('live-batting-team').innerText = currentBall.team_name || currentBall.batting_team || "New Zealand";
                document.getElementById('live-status-note').innerText = currentBall.status || currentBall.match_status || "Match data streaming live";

                // 2. Build the Over Timeline Feed List
                let feedHtml = "";
                items.slice(0, 15).forEach(ball => {
                    const runValue = ball.runs !== undefined ? ball.runs : (ball.ball_runs !== undefined ? ball.ball_runs : "•");
                    const overValue = ball.over || ball.overs || ball.over_no || "0.0";
                    const textValue = ball.commentary || ball.text || ball.desc || "Delivery tracked.";
                    
                    let badgeStyle = "bg-zinc-800 text-zinc-300";
                    if (runValue == "4" || runValue == "6") badgeStyle = "bg-green-950 text-green-400 font-bold border border-green-900/30";
                    if (String(runValue).toLowerCase().includes('w') || ball.wicket) badgeStyle = "bg-red-950 text-red-400 font-bold border border-red-900/30";

                    feedHtml += `
                        <div class="flex items-start space-x-3 pt-3 first:pt-0">
                            <div class="text-xs font-mono font-bold text-zinc-500 w-12 pt-0.5">Ov ${overValue}</div>
                            <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs flex-shrink-0 ${badgeStyle}">${runValue}</div>
                            <div class="text-xs md:text-sm text-zinc-300 flex-1 leading-relaxed">${textValue}</div>
                        </div>`;
                });
                
                document.getElementById('commentary-feed-box').innerHTML = feedHtml;
                document.getElementById('sync-status').innerText = "✓ Live Synced";
                document.getElementById('sync-status').className = "text-[#81c784]";

            } catch (err) {
                console.error("Parser Error:", err);
                document.getElementById('sync-status').innerText = "Sync Alert";
                document.getElementById('sync-status').className = "text-red-400 font-bold";
                
                if (terminal) {
                    terminal.classList.remove('hidden');
                    terminal.innerText = `System Alert: ${err.message}`;
                }
            }
        }

        // Run on app initiation
        parseCommentaryData();
        setInterval(parseCommentaryData, CONFIG.intervalMs);
    </script>
</body>
</html>
