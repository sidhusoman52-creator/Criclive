<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricLive - Premium Live Scores</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .cb-nav { background-color: #004f3f; }
        .cb-bg { background-color: #0f1011; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="cb-bg min-h-screen text-gray-100 font-sans relative transition-colors duration-300" id="app-body">

    <header class="cb-nav text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center flex-wrap gap-3">
            <div class="flex items-center gap-3">
                <span class="text-2xl font-black tracking-tighter bg-lime-500 text-black px-2 py-0.5 rounded-sm">CricLive</span>
                <span class="text-xs font-bold uppercase tracking-widest text-lime-400 border border-lime-400/30 px-1.5 py-0.5 rounded animate-pulse">Live App</span>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="toggleAudioAlerts()" id="audio-btn" class="text-xs font-semibold bg-emerald-900/40 hover:bg-emerald-800/60 border border-emerald-700/30 px-2.5 py-1.5 rounded transition-all flex items-center gap-1 text-zinc-400">
                    🔊 Audio Alerts: Off
                </button>
                <button onclick="toggleTheme()" class="text-xs font-semibold bg-zinc-800 hover:bg-zinc-700 px-2.5 py-1.5 rounded border border-zinc-700/50 transition-all">
                    🎨 Switch UI Look
                </button>
                <div id="refresh-indicator" class="text-xs text-lime-300 font-mono bg-emerald-900/50 px-2 py-1.5 rounded border border-emerald-700/30">
                    🔄 Syncing...
                </div>
            </div>
        </div>
    </header>

    <nav class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex items-center justify-between px-4 flex-wrap gap-2">
            <div class="flex font-medium text-sm">
                <button onclick="switchTab('live')" id="tab-live" class="py-4 px-6 border-b-2 border-lime-500 text-lime-500 font-bold transition-all whitespace-nowrap">
                    Live Matches
                </button>
                <button onclick="switchTab('schedule')" id="tab-schedule" class="py-4 px-6 border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition-all whitespace-nowrap">
                    Schedules
                </button>
            </div>
            <div class="py-2">
                <input type="text" id="match-search" oninput="filterMatches()" placeholder="🔍 Search team or series..." class="bg-zinc-950 text-xs text-gray-200 placeholder-zinc-500 px-3 py-1.5 rounded-lg border border-zinc-800 focus:outline-none focus:border-lime-500 w-48 transition-all">
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-6">
        <section id="content-live" class="tab-content">
            <div id="status-message" class="text-center py-12 max-w-md mx-auto bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-xl">
                <p class="text-sm text-zinc-400 animate-pulse">Connecting to RapidAPI CricLive stream...</p>
            </div>
            <div id="matches-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
            </div>
        </section>

        <section id="content-schedule" class="tab-content hidden">
            <div id="schedule-status-message" class="text-center py-12 max-w-md mx-auto bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-xl">
                <p class="text-sm text-zinc-400 animate-pulse">Loading upcoming cricket calendar...</p>
            </div>
            <div id="schedule-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
            </div>
        </section>
    </main>

    <div id="scorecard-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-2xl rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950">
                <div>
                    <span id="modal-match-type" class="text-[10px] bg-lime-950 text-lime-400 border border-lime-800 px-2 py-0.5 rounded font-bold uppercase tracking-wider"></span>
                    <h2 id="modal-series-name" class="text-xs text-zinc-400 mt-1 font-medium line-clamp-1"></h2>
                </div>
                <div class="flex gap-2">
                    <button onclick="shareMatchDetails()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-sky-400 px-2.5 py-1.5 rounded-lg border border-zinc-700 transition-colors">🔗 Share Score</button>
                    <button onclick="closeModal()" class="text-zinc-400 hover:text-white p-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 transition-colors text-sm font-bold">✕ Close</button>
                </div>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-6">
                <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800/60 space-y-4">
                    <div class="flex justify-between items-center">
                        <span id="modal-team1-name" class="font-bold text-lg text-white"></span>
                        <span id="modal-team1-score" class="font-mono text-base font-bold text-lime-400"></span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span id="modal-team2-name" class="font-bold text-lg text-white"></span>
                        <span id="modal-team2-score" class="font-mono text-base font-bold text-lime-400"></span>
                    </div>
                    <div id="modal-match-status" class="text-xs font-semibold text-amber-400 pt-2 border-t border-zinc-800 text-center"></div>
                </div>

                <div id="live-stats-section" class="space-y-4">
                    <div>
                        <h4 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">🏏 Live Batting</h4>
                        <div class="table-container bg-zinc-950 border border-zinc-800 rounded-lg">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="border-b border-zinc-800 bg-zinc-900/50 text-zinc-400">
                                        <th class="p-3 font-semibold">Batsman</th>
                                        <th class="p-3 font-mono font-semibold text-center">R</th>
                                        <th class="p-3 font-mono font-semibold text-center">B</th>
                                        <th class="p-3 font-mono font-semibold text-center">4s</th>
                                        <th class="p-3 font-mono font-semibold text-center">6s</th>
                                        <th class="p-3 font-mono font-semibold text-center">SR</th>
                                    </tr>
                                </thead>
                                <tbody id="modal-batsmen-body"></tbody>
                            </table>
                        </div>
                    </div>

                    <div>
                        <h4 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">⚾ Active Bowling</h4>
                        <div class="table-container bg-zinc-950 border border-zinc-800 rounded-lg">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="border-b border-zinc-800 bg-zinc-900/50 text-zinc-400">
                                        <th class="p-3 font-semibold">Bowler</th>
                                        <th class="p-3 font-mono font-semibold text-center">O</th>
                                        <th class="p-3 font-mono font-semibold text-center">M</th>
                                        <th class="p-3 font-mono font-semibold text-center">R</th>
                                        <th class="p-3 font-mono font-semibold text-center">W</th>
                                        <th class="p-3 font-mono font-semibold text-center">ECO</th>
                                    </tr>
                                </thead>
                                <tbody id="modal-bowler-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div id="no-live-stats-msg" class="text-center py-6 bg-zinc-950 border border-zinc-800 rounded-lg text-xs text-zinc-500 hidden">
                    Live player updates are not available for this game state.
                </div>
            </div>
        </div>
    </div>

    <script>
        const RAPIDAPI_KEY = "5c86953d66mshe0d3e06701aa1ddp14c43djsn3eac42f75725";
        const RAPIDAPI_HOST = "cricbuzz-cricket.p.rapidapi.com";
        const HEADERS = { "Content-Type": "application/json", "x-rapidapi-host": RAPIDAPI_HOST, "x-rapidapi-key": RAPIDAPI_KEY };

        const LIVE_MATCHES_URL = "https://cricbuzz-cricket.p.rapidapi.com/matches/v1/live";
        const UPCOMING_MATCHES_URL = "https://cricbuzz-cricket.p.rapidapi.com/matches/v1/recent";

        let scheduleFetched = false;
        let globalLiveMatchesCache = [];
        let isAudioEnabled = false;
        let lastAnnouncedStatus = {};
        let currentTheme = 'dark';

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('text-lime-500', 'border-lime-500', 'font-bold');
                btn.classList.add('text-gray-400', 'border-transparent');
            });
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.remove('text-gray-400', 'border-transparent');
            activeBtn.classList.add('text-lime-500', 'border-lime-500', 'font-bold');

            if (tabName === 'schedule' && !scheduleFetched) fetchSchedules();
        }

        // FEATURE 1: UI Theme Customization 
        function toggleTheme() {
            const body = document.getElementById('app-body');
            if(currentTheme === 'dark') {
                body.classList.replace('cb-bg', 'bg-zinc-950'); // Midnight Mode
                currentTheme = 'midnight';
            } else {
                body.classList.replace('bg-zinc-950', 'cb-bg'); // Classic Dark Mode
                currentTheme = 'dark';
            }
        }

        // FEATURE 2: Text-to-Speech Engine
        function toggleAudioAlerts() {
            isAudioEnabled = !isAudioEnabled;
            const btn = document.getElementById('audio-btn');
            if(isAudioEnabled) {
                btn.innerText = "🔊 Audio Alerts: On";
                btn.classList.replace('text-zinc-400', 'text-lime-400');
                speakNotification("Audio assistance enabled.");
            } else {
                btn.innerText = "🔊 Audio Alerts: Off";
                btn.classList.replace('text-lime-400', 'text-zinc-400');
            }
        }

        function speakNotification(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        // FEATURE 3: Search Filter Engine
        function filterMatches() {
            const query = document.getElementById('match-search').value.toLowerCase();
            const matchCards = document.querySelectorAll('#matches-container > div');
            matchCards.forEach(card => {
                const contentText = card.innerText.toLowerCase();
                if(contentText.includes(query)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        // FEATURE 4: Native Social Sharing Interface API
        function shareMatchDetails() {
            const series = document.getElementById('modal-series-name').innerText;
            const t1 = document.getElementById('modal-team1-name').innerText;
            const t2 = document.getElementById('modal-team2-name').innerText;
            const status = document.getElementById('modal-match-status').innerText;

            const text = `🏏 Follow ${t1} vs ${t2} live on CricLive!\n🏆 Series: ${series}\n📈 Status: ${status}\n Check it out here:`;
            
            if (navigator.share) {
                navigator.share({ title: 'CricLive Update', text: text, url: window.location.href });
            } else {
                navigator.clipboard.writeText(`${text} ${window.location.href}`);
                alert("Match metrics text copied to clipboard! Share it anywhere.");
            }
        }

        // Live Fetcher Loop
        async function fetchLiveScores() {
            const statusEl = document.getElementById('status-message');
            const containerEl = document.getElementById('matches-container');
            const indicatorEl = document.getElementById('refresh-indicator');

            try {
                indicatorEl.innerText = "🔄 Syncing...";
                const response = await fetch(LIVE_MATCHES_URL, { method: "GET", headers: HEADERS });
                if (!response.ok) throw new Error(`HTTP Error Code ${response.status}`);
                const result = await response.json();

                if (!result.typeMatches || result.typeMatches.length === 0) {
                    statusEl.innerHTML = `<p class="text-sm text-zinc-400">🏏 No games are live right now.</p>`;
                    return;
                }

                containerEl.innerHTML = '';
                statusEl.classList.add('hidden');
                containerEl.classList.remove('hidden');
                globalLiveMatchesCache = [];

                result.typeMatches.forEach(matchTypeGroup => {
                    const matchType = matchTypeGroup.matchType || "International";
                    if (matchTypeGroup.seriesMatches) {
                        matchTypeGroup.seriesMatches.forEach(series => {
                            if (series.seriesAdWrapper && series.seriesAdWrapper.matches) {
                                series.seriesAdWrapper.matches.forEach(matchInfo => {
                                    const m = matchInfo.matchInfo;
                                    const score = matchInfo.matchScore;
                                    if (!m) return;

                                    globalLiveMatchesCache.push({ matchType, ...matchInfo });
                                    const arrayIndexId = globalLiveMatchesCache.length - 1;

                                    // Trigger smart audio alert tracking if match status text changes dynamically
                                    if (isAudioEnabled && lastAnnouncedStatus[m.matchId] !== m.status) {
                                        speakNotification(`${m.team1.teamName} versus ${m.team2.teamName}. ${m.status}`);
                                        lastAnnouncedStatus[m.matchId] = m.status;
                                    }

                                    const card = document.createElement('div');
                                    card.className = "bg-zinc-900 border border-zinc-800 hover:border-lime-500/40 rounded-lg p-5 shadow-md flex flex-col justify-between cursor-pointer transition-all transform hover:-translate-y-0.5";
                                    card.setAttribute('onclick', `openScorecardModal(${arrayIndexId})`);

                                    const team1Score = score && score.team1Score ? `${score.team1Score.inngs1.runs}/${score.team1Score.inngs1.wickets || 0} <span class="text-xs text-zinc-500">(${score.team1Score.inngs1.overs} ov)</span>` : `<span class="text-xs text-zinc-600">Yet to bat</span>`;
                                    const team2Score = score && score.team2Score ? `${score.team2Score.inngs1.runs}/${score.team2Score.inngs1.wickets || 0} <span class="text-xs text-zinc-500">(${score.team2Score.inngs1.overs} ov)</span>` : `<span class="text-xs text-zinc-600">Yet to bat</span>`;

                                    card.innerHTML = `
                                        <div>
                                            <div class="flex justify-between items-center text-[11px] font-bold tracking-wider text-zinc-500 uppercase border-b border-zinc-800 pb-2 mb-3">
                                                <span>${matchType}</span>
                                                <span class="flex items-center gap-1.5 text-rose-500 bg-rose-950/20 px-2 py-0.5 rounded font-mono text-[10px]">
                                                    <span class="w-1.5 h-1.5 bg-rose-500 rounded-full animate-pulse"></span>${m.state || 'LIVE'}
                                                </span>
                                            </div>
                                            <h2 class="text-xs text-zinc-400 line-clamp-1 mb-4">${m.seriesName}</h2>
                                            <div class="space-y-3.5 my-2">
                                                <div class="flex justify-between items-center">
                                                    <span class="font-bold text-zinc-200 text-base tracking-tight">${m.team1.teamName}</span>
                                                    <span class="font-mono text-sm font-bold text-zinc-100">${team1Score}</span>
                                                </div>
                                                <div class="flex justify-between items-center">
                                                    <span class="font-bold text-zinc-200 text-base tracking-tight">${m.team2.teamName}</span>
                                                    <span class="font-mono text-sm font-bold text-zinc-100">${team2Score}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="mt-5 pt-3 border-t border-zinc-800/80 flex justify-between items-center text-xs font-semibold text-sky-400">
                                            <span class="truncate max-w-[85%]">👉 ${m.status || 'Updating...'}</span>
                                            <span class="text-[10px] text-zinc-500 bg-zinc-800 px-1.5 py-0.5 rounded">Stats ➔</span>
                                        </div>
                                    `;
                                    containerEl.appendChild(card);
                                });
                            }
                        });
                    }
                });

                indicatorEl.innerText = "✅ Updated";
                filterMatches(); // Ensure existing keyword filters persist across re-renders
            } catch (err) {
                console.error(err);
                indicatorEl.innerText = "❌ Offline";
            }
        }

        function openScorecardModal(index) {
            const dataItem = globalLiveMatchesCache[index];
            if (!dataItem) return;

            const m = dataItem.matchInfo;
            const score = dataItem.matchScore;
            const mini = da
