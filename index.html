<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricbuzz Clone - RapidAPI Realtime Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
        .animate-pulse-dot { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-[#121212] text-gray-200 font-sans antialiased">

    <header class="bg-[#004d40] p-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-tight text-white">Cricbuzz Clone</span>
            <span class="bg-[#1b5e20] text-[#81c784] text-[10px] font-bold px-1.5 py-0.5 rounded tracking-wide">RAPIDAPI LIVE</span>
        </div>
        <div class="flex items-center space-x-1 text-xs font-medium bg-[#1e1e1e]/40 px-2 py-1 rounded">
            <span id="sync-status" class="text-[#81c784]">✓ Connected</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4">
        
        <div class="bg-[#1e1e1e] rounded-xl p-5 border border-gray-800 shadow-sm">
            <div class="flex justify-between items-center mb-3">
                <span class="text-[10px] font-bold uppercase tracking-wider bg-red-900/40 text-red-400 px-2 py-0.5 rounded flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse-dot"></span> LIVE MATCH INNINGS 2
                </span>
                <span class="text-xs text-zinc-500 font-mono" id="live-over-counter">Overs: 0.0</span>
            </div>
            
            <div class="flex justify-between items-baseline my-4">
                <div>
                    <h2 class="text-xl font-extrabold text-white tracking-tight" id="live-batting-team">Chasing Team</h2>
                    <p class="text-[11px] text-[#29b6f6] font-medium mt-1" id="live-status-note">Fetching real-time target status...</p>
                </div>
                <div class="text-right">
                    <div class="text-3xl font-black text-white tracking-tight" id="live-main-score">0/0</div>
                    <p class="text-xs text-zinc-400 mt-1" id="live-crr">CRR: 0.00</p>
                </div>
            </div>
        </div>

        <div class="bg-[#1e1e1e] rounded-xl p-4 border border-gray-800 shadow-sm">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Live Ball-By-Ball Feed</h3>
            <div id="commentary-feed-box" class="space-y-3 max-h-[400px] overflow-y-auto pr-1 divide-y divide-gray-800/60">
                <div class="p-4 text-center text-zinc-500 text-sm">Waiting for live data packet stream...</div>
            </div>
        </div>
    </main>

    <script>
        // Mapping configurations straight from your curl command
        const CONFIG = {
            url: "https://cricket-live-line-advance.p.rapidapi.com/matches/87014/innings/2/commentary",
            headers: {
                "x-rapidapi-host": "cricket-live-line-advance.p.rapidapi.com",
                "x-rapidapi-key": "5c86953d66mshe0d3e06701aa1ddp14c43djsn3eac42f75725",
                "Content-Type": "application/json"
            },
            intervalMs: 8000 // Refreshes automatically every 8 seconds
        };

        async function syncRapidApiBallByBall() {
            try {
                const response = await fetch(CONFIG.url, {
                    method: "GET",
                    headers: CONFIG.headers
                });

                if (!response.ok) throw new Error("RapidAPI credit or server error");
                const payload = await response.json();
                
                // Read the commentary array from the response data structure
                // Adjust 'payload.data' or 'payload.response' if your specific API uses a wrapper object
                const commentaryList = payload.data || payload.commentary || payload;

                if (!Array.isArray(commentaryList) || commentaryList.length === 0) {
                    document.getElementById('commentary-feed-box').innerHTML = `
                        <div class="text-center py-4 text-zinc-500 text-xs">
                            Match active. Awaiting first ball data packet...
                        </div>`;
                    return;
                }

                // 1. Grab the absolute newest ball bowled (the first item in the live array)
                const latestBall = commentaryList[0];

                // 2. Extract metrics dynamically from the packet
                // Note: If your API uses slightly different keys (like 'runs', 'score_runs', 'over_no'), change them here:
                const liveScore  = latestBall.score || latestBall.total_runs || "0/0"; 
                const liveOvers  = latestBall.over || latestBall.over_number || "0.0";
                const teamName   = latestBall.team_name || latestBall.batting_team || "Innings 2";
                const currentCrr = latestBall.crr || latestBall.run_rate || "0.00";
                const statusNote = latestBall.status || latestBall.match_commentary || "Play in progress";

                // 3. Render directly onto the screen elements
                document.getElementById('live-main-score').innerText = liveScore;
                document.getElementById('live-over-counter').innerText = `Overs: ${liveOvers}`;
                document.getElementById('live-batting-team').innerText = teamName;
                document.getElementById('live-crr').innerText = `CRR: ${currentCrr}`;
                document.getElementById('live-status-note').innerText = `👉 ${statusNote}`;

                // 4. Generate the beautiful bottom rolling log list of historical balls
                let feedHtml = "";
                commentaryList.slice(0, 15).forEach(ball => {
                    const overNum = ball.over || "0.0";
                    const ballRuns = ball.runs !== undefined ? ball.runs : "•";
                    const ballText = ball.commentary || ball.text || "Delivery completed.";
                    
                    // Style specific events like boundaries or wickets uniquely
                    let badgeColor = "bg-zinc-800 text-zinc-300";
                    if (ballRuns == "4" || ballRuns == "6") badgeColor = "bg-green-950 text-green-400 font-bold border border-green-800/50";
                    if (String(ballRuns).toLowerCase().includes('w') || ball.is_wicket) badgeColor = "bg-red-950 text-red-400 font-bold border border-red-800/50";

                    feedHtml += `
                        <div class="flex items-start space-x-3 pt-3 first:pt-0">
                            <div class="flex-shrink-0 text-xs font-mono font-bold text-zinc-500 w-10 pt-1">
                                Ov ${overNum}
                            </div>
                            <div class="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs ${badgeColor}">
                                ${ballRuns}
                            </div>
                            <div class="text-xs md:text-sm text-zinc-300 flex-1 leading-relaxed">
                                ${ballText}
                            </div>
                        </div>
                    `;
                });

                document.getElementById('commentary-feed-box').innerHTML = feedHtml;
                
                // Update header status verification
                document.getElementById('sync-status').innerText = "✓ Live Synced";
                document.getElementById('sync-status').className = "text-[#81c784]";

            } catch (err) {
                console.error("RapidAPI Stream Error:", err);
                document.getElementById('sync-status').innerText = "Sync Alert";
                document.getElementById('sync-status').className = "text-red-400";
            }
        }

        // Boot and start the recurring execution tracker loop
        syncRapidApiBallByBall();
        setInterval(syncRapidApiBallByBall, CONFIG.intervalMs);
    </script>
</body>
</html>
