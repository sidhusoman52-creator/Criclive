<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CricLive - Cricket Scores</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f1f5f9;
}

header{
background:#0f172a;
color:white;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
padding:15px;
flex-wrap:wrap;
}

.tab{
padding:10px 18px;
border:none;
border-radius:8px;
background:#e2e8f0;
font-weight:bold;
cursor:pointer;
}

.tab.active{
background:#2563eb;
color:white;
}

.matches{
padding:15px;
max-width:800px;
margin:auto;
}

.card{
background:white;
border-radius:12px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.match-title{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.score{
font-size:20px;
color:#16a34a;
font-weight:bold;
margin:8px 0;
}

.status{
color:#dc2626;
font-weight:bold;
}

footer{
text-align:center;
padding:20px;
color:#666;
}
</style>
</head>

<body>

<header>
🏏 CricLive
</header>

<div class="tabs">
<button class="tab active" onclick="showCategory('ipl',this)">IPL</button>
<button class="tab" onclick="showCategory('international',this)">International</button>
<button class="tab" onclick="showCategory('women',this)">Women</button>
</div>

<div class="matches" id="matches"></div>

<footer>
CricLive © 2026
</footer>

<script>
const matchesData = {
ipl:[
{
title:"GT vs RCB",
score:"GT 185/4 (18.2)",
status:"Live"
},
{
title:"CSK vs MI",
score:"MI won by 5 wickets",
status:"Completed"
}
],

international:[
{
title:"India vs England",
score:"India 287/6",
status:"Live"
},
{
title:"Australia vs South Africa",
score:"Australia won by 42 runs",
status:"Completed"
}
],

women:[
{
title:"India Women vs Australia Women",
score:"India Women 178/4",
status:"Live"
},
{
title:"England Women vs NZ Women",
score:"England Women won by 7 wickets",
status:"Completed"
}
]
};

function render(category){
const container=document.getElementById("matches");

container.innerHTML=matchesData[category]
.map(match=>`
<div class="card">
<div class="match-title">${match.title}</div>
<div class="score">${match.score}</div>
<div class="status">${match.status}</div>
</div>
`).join("");
}

function showCategory(category,btn){
document.querySelectorAll(".tab").forEach(t=>{
t.classList.remove("active");
});

btn.classList.add("active");
render(category);
}

render("ipl");
</script>

</body>
</html>
