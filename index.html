<!DOCTYPE html>
<html>
<head>
  <title>Live Cricket Score</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .score {
      font-size: 28px;
      margin: 10px 0;
    }

    .team {
      font-size: 18px;
      color: #333;
    }
  </style>
</head>

<body>

  <h2>🏏 Live Cricket Score</h2>

  <div class="card">
    <div class="team" id="match">Loading match...</div>
    <div class="score" id="score">--</div>
    <div id="status">Please wait...</div>
  </div>

<script>

const API_URL = "https://api.cricapi.com/v1/currentMatches?apikey=21ba7825-b668-4ef9-b5ed-91680688b513

async function loadScore() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    const match = data.data[0]; // first live match

    document.getElementById("match").innerText =
      match.teams[0] + " vs " + match.teams[1];

    document.getElementById("score").innerText =
      match.score ? match.score : "Score updating...";

    document.getElementById("status").innerText =
      match.status;

  } catch (err) {
    document.getElementById("status").innerText =
      "Error loading data";
  }
}

loadScore();
setInterval(loadScore, 30000); // refresh every 30 sec

</script>

</body>
</html>
