<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cricbuzz Clone</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        body {
            background: #0f1011;
            color: white;
            font-family: Arial, sans-serif;
        }

        .cb-nav {
            background: #005c46;
        }

        .tab-active {
            color: #84cc16;
            border-bottom: 2px solid #84cc16;
            font-weight: bold;
        }

        .tab-btn {
            padding: 14px 22px;
            color: #a1a1aa;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            white-space: nowrap;
        }

        .match-card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 18px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: red;
            border-radius: 999px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: .3;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="cb-nav shadow-lg">

        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

            <div class="flex items-center gap-3">

                <div class="bg-lime-500 text-black px-3 py-1 rounded font-black text-xl">
                    cricbuzz
                </div>

                <div class="text-lime-400 text-xs font-bold">
                    LIVE
                </div>

            </div>

            <div id="refresh-status" class="text-xs text-lime-300">
                Updating...
            </div>

        </div>

    </header>

    <!-- NAVIGATION -->

    <nav class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">

        <div class="max-w-6xl mx-auto flex overflow-x-auto">

            <button id="live-tab"
                class="tab-btn tab-active"
                onclick="switchTab('live')">
                Live Matches
            </button>

            <button id="schedule-tab"
                class="tab-btn"
                onclick="switchTab('schedule')">
                Upcoming Matches
            </button>

        </div>

    </nav>

    <!-- MAIN -->

    <main class="max-w-6xl mx-auto px-4 py-6">

        <!-- LIVE -->

        <section id="live-section">

            <div id="live-loading"
                class="text-center text-zinc-400 py-10">
                Loading live matches...
            </div>

            <div id="live-container"
                class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
            </div>

        </section>

        <!-- SCHEDULE -->

        <section id="schedule-section" class="hidden">

            <div id="schedule-loading"
                class="text-center text-zinc-400 py-10">
                Loading upcoming matches...
            </div>

            <div id="schedule-container"
                class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
            </div>

        </section>

    </main>

    <script>

        /* =========================
           API
        ========================= */

        const API_KEY = "21ba7825-b668-4ef9-b5ed-91680688b513";

        const LIVE_API =
            `https://api.cricapi.com/v1/currentMatches?apikey=${API_KEY}&offset=0`;

        const SCHEDULE_API =
            `https://api.cricapi.com/v1/matches?apikey=${API_KEY}&offset=0`;

        /* =========================
           FILTER
        ========================= */

        function isImportantMatch(match) {

            if (!match || !match.name) {
                return false;
            }

            const text =
                match.name.toLowerCase();

            const allowed = [

                "india",
                "australia",
                "england",
                "pakistan",
                "new zealand",
                "south africa",
                "bangladesh",
                "afghanistan",
                "sri lanka",
                "west indies",
                "ireland",
                "zimbabwe",

                "ipl",
                "indian premier league",

                "women",
                "womens"

            ];

            const blocked = [

                "sub regional",
                "u19",
                "academy",
                "division",
                "county",

                "botswana",
                "mali",
                "rwanda",
                "cameroon",
                "sierra leone",
                "ivory coast"

            ];

            const hasAllowed =
                allowed.some(word =>
                    text.includes(word)
                );

            const hasBlocked =
                blocked.some(word =>
                    text.includes(word)
                );

            return hasAllowed && !hasBlocked;
        }

        /* =========================
           TAB SYSTEM
        ========================= */

        function switchTab(tab) {

            document
                .getElementById("live-section")
                .classList.add("hidden");

            document
                .getElementById("schedule-section")
                .classList.add("hidden");

            document
                .getElementById("live-tab")
                .classList.remove("tab-active");

            document
                .getElementById("schedule-tab")
                .classList.remove("tab-active");

            if (tab === "live") {

                document
                    .getElementById("live-section")
                    .classList.remove("hidden");

                document
                    .getElementById("live-tab")
                    .classList.add("tab-active");

            } else {

                document
                    .getElementById("schedule-section")
                    .classList.remove("hidden");

                document
                    .getElementById("schedule-tab")
                    .classList.add("tab-active");

            }
        }

        /* =========================
           LIVE MATCHES
        ========================= */

        async function loadLiveMatches() {

            const loading =
                document.getElementById("live-loading");

            const container =
                document.getElementById("live-container");

            const refresh =
                document.getElementById("refresh-status");

            try {

                refresh.innerText = "Updating...";

                const response =
                    await fetch(LIVE_API);

                const result =
                    await response.json();

                console.log(result);

                if (
                    result.status !== "success" ||
                    !result.data
                ) {

                    loading.innerHTML =
                        "Failed to load matches";

                    return;
                }

                const matches =
                    result.data.filter(isImportantMatch);

                if (matches.length === 0) {

                    loading.innerHTML =
                        "No international or IPL matches live";

                    return;
                }

                container.innerHTML = "";

                loading.classList.add("hidden");

                container.classList.remove("hidden");

                matches.forEach(match => {

                    const team1 =
                        match.teams?.[0] || "Team 1";

                    const team2 =
                        match.teams?.[1] || "Team 2";

                    const score1 =
                        match.score?.[0]
                            ? `${match.score[0].r}/${match.score[0].w} (${match.score[0].o} ov)`
                            : "Yet to bat";

                    const score2 =
                        match.score?.[1]
                            ? `${match.score[1].r}/${match.score[1].w} (${match.score[1].o} ov)`
                            : "Yet to bat";

                    const card =
                        document.createElement("div");

                    card.className = "match-card";

                    card.innerHTML = `

                        <div class="flex justify-between items-center mb-3">

                            <div class="text-xs uppercase text-zinc-500">
                                ${match.matchType || "Match"}
                            </div>

                            <div class="flex items-center gap-2 text-red-500 text-xs font-bold">
                                <div class="live-dot"></div>
                                LIVE
                            </div>

                        </div>

                        <div class="text-sm text-zinc-400 mb-5">
                            ${match.name}
                        </div>

                        <div class="space-y-4">

                            <div class="flex justify-between">

                                <div class="font-bold">
                                    ${team1}
                                </div>

                                <div class="font-bold">
                                    ${score1}
                                </div>

                            </div>

                            <div class="flex justify-between">

                                <div class="font-bold">
                                    ${team2}
                                </div>

                                <div class="font-bold">
                                    ${score2}
                                </div>

                            </div>

                        </div>

                        <div class="border-t border-zinc-800 mt-5 pt-3 text-sky-400 text-sm">
                            ${match.status || ""}
                        </div>

                    `;

                    container.appendChild(card);

                });

                refresh.innerText = "Updated";

            } catch (error) {

                console.log(error);

                loading.innerHTML =
                    "Error loading matches";
            }
        }

        /* =========================
           UPCOMING MATCHES
        ========================= */

        async function loadUpcomingMatches() {

            const loading =
                document.getElementById("schedule-loading");

            const container =
                document.getElementById("schedule-container");

            try {

                const response =
                    await fetch(SCHEDULE_API);

                const result =
                    await response.json();

                if (
                    result.status !== "success" ||
                    !result.data
                ) {

                    loading.innerHTML =
                        "Failed to load upcoming matches";

                    return;
                }

                const matches =
                    result.data.filter(match => {

                        return (
                            !match.matchStarted &&
                            isImportantMatch(match)
                        );

                    });

                if (matches.length === 0) {

                    loading.innerHTML =
                        "No upcoming matches";

                    return;
                }

                container.innerHTML = "";

                loading.classList.add("hidden");

                container.classList.remove("hidden");

                matches.slice(0, 20).forEach(match => {

                    const date =
                        match.date
                            ? new Date(match.date)
                                .toLocaleString()
                            : "Date not available";

                    const card =
                        document.createElement("div");

                    card.className = "match-card";

                    card.innerHTML = `

                        <div class="flex justify-between items-center mb-3">

                            <div class="text-xs uppercase text-zinc-500">
                                ${match.matchType || "Match"}
                            </div>

                            <div class="text-lime-400 text-xs font-bold">
                                UPCOMING
                            </div>

                        </div>

                        <div class="font-bold text-white mb-3">
                            ${match.name}
                        </div>

                        <div class="text-zinc-400 text-sm mb-3">
                            ${date}
                        </div>

                        <div class="text-zinc-500 text-xs">
                            ${match.venue || ""}
                        </div>

                    `;

                    container.appendChild(card);

                });

            } catch (error) {

                console.log(error);

                loading.innerHTML =
                    "Error loading upcoming matches";
            }
        }

        /* =========================
           START
        ========================= */

        loadLiveMatches();

        loadUpcomingMatches();

        setInterval(() => {

            loadLiveMatches();

        }, 30000);

    </script>

</body>

</html>
