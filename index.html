<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricLive - Premium Live Scores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cb-nav { background-color: #004f3f; }
        .cb-bg { background-color: #0f1011; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="cb-bg min-h-screen text-gray-100 font-sans relative" id="app-body">

    <header class="cb-nav text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl font-black tracking-tighter bg-lime-500 text-black px-2 py-0.5 rounded-sm">CricLive</span>
                <span class="text-xs font-bold uppercase tracking-widest text-lime-400 border border-lime-400/30 px-1.5 py-0.5 rounded animate-pulse">Live App</span>
            </div>
            <div id="refresh-indicator" class="text-xs text-lime-300 font-mono bg-emerald-900/50 px-2 py-1 rounded border border-emerald-700/30">
                🔄 Syncing...
            </div>
        </div>
    </header>

    <nav class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex items-center justify-between px-4">
            <div class="flex font-medium text-sm">
                <button onclick="switchMainTab('live')" id="tab-live" class="py-4 px-6 border-b-2 border-lime-500 text-lime-500 font-bold transition-all whitespace-nowrap">
                    Live Matches
                </button>
                <button onclick="switchMainTab('schedule')" id="tab-schedule" class="py-4 px-6 border-b-2 border-transparent text-gray-400 hover:text-gray-200 transition-all whitespace-nowrap">
                    Schedules
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-6">
        <section id="content-live" class="main-tab-content">
            <div id="status-message" class="text-center py-12 max-w-md mx-auto bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-xl">
                <p class="text-sm text-zinc-400 animate-pulse">Connecting to RapidAPI CricLive stream...</p>
            </div>
            <div id="matches-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
            </div>
        </section>

        <section id="content-schedule" class="main-tab-content hidden">
            <div id="schedule-status-message" class="text-center py-12 max-w-md mx-auto bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-xl">
                <p class="text-sm text-zinc-400 animate-pulse">Loading upcoming cricket calendar...</p>
            </div>
            <div id="schedule-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
            </div>
        </section>

        <section id="detailed-match-view" class="mt-8 bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-xl hidden">
            <div class="flex justify-between items-start border-b border-zinc-800 pb-4 mb-4 flex-wrap gap-3">
                <div>
                    <span id="detail-match-type" class="text-[10px] bg-lime-950 text-lime-400 border border-lime-800 px-2 py-0.5 rounded font-bold uppercase tracking-wider"></span>
                    <h2 id="detail-series-name" class="text-sm
