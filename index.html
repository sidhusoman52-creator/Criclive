<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricLive</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .cricbuzz-dark { background-color: #1a1a1a; }
        .cb-nav { background-color: #004f3f; } /* Classic Cricbuzz Green */
        .cb-bg { background-color: #0f1011; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="cb-bg min-h-screen text-gray-100 font-sans relative">

    <header class="cb-nav text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl font-black tracking-tighter bg-lime-500 text-black px-2 py-0.5 rounded-sm">CricLive</span>
                <span class="text-xs font-bold uppercase tracking-widest text-lime-400 border border-lime-400/30 px-1.5 py-0.5 rounded animate-pulse">Live App</span>
            </div>
            <div id="refresh-indicator" class="text-xs text-lime-300 font-mono bg-emerald-900/50 px-2 py-1 rounded border border-emerald-700/30">
                🔄 Syncing live...
            </div>
        </div>
    </header>

    <nav class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex overflow-x-auto font-medium text-sm">
            <button onclick="switchTab('live')" id="tab-live" class="py-3 px-6 border-b-2 border-lime-500 text-lime-500 whitespace-nowrap font-bold transition-all">
                Live Matches
            </button>
            <button onclick="switchTab('schedule')" id="tab-schedule" class="py-3 px-6 border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap transition-all">
                Schedules
            </button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-6">
        
        <section id="content-live" class="tab-content">
            <div id="status-message" class="text-center py-12 max-w-md mx-auto bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-xl">
                <p class="text-sm text-zinc-400 animate-pulse">Connecting to RapidAPI CricLive stream...</p>
            </div>
            <div id="matches-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
            </div>
        </section>

        <section id="content-schedule" class="tab-content hidden">
            <div id="schedule-status-message" class="text-center py-12 max-w-md mx-auto bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-xl">
                <p class="text-sm text-zinc-400 animate-pulse">Loading upcoming cricket calendar...</p>
            </div>
            <div id="schedule-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
            </div>
        </section>

    </main>

    <!-- DETAILED LIVE SCORE MODAL -->
    <div id="scorecard-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-2xl rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <!-- Modal Header -->
            <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950">
                <div>
                    <span id="modal-match-type" class="text-[10px] bg-lime-950 text-lime-400 border border-lime-800 px-2 py-0.5 rounded font-bold uppercase tracking-wider"></span>
                    <h2 id="modal-series-name" class="text-xs text-zinc-400 mt-1 font-medium line-clamp-1"></h2>
                </div>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-white p-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 transition-colors text-sm font-bold">✕ Close</button>
            </div>
            
            <!-- Modal Body (Scrollable) -->
            <div class="p-6 overflow-y-auto space-y-6">
                <!-- Teams & Main Live Scores -->
                <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800/60 space-y-4">
                    <div class="flex justify-between items-center">
                        <span id="modal-team1-name" class="font-bold text-lg text-white"></span>
                        <span id="modal-team1-score" class="font-mono text-base font-bold text-lime-400"></span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span id="modal-team2-name" class="font-bold text-lg text-white"></span>
                        <span id="modal-team2-score" class="font-mono text-base font-bold text-lime-400"></span>
                    </div>
                    <div id="modal-match-status" class="text-xs font-semibold text-amber-400 pt-2 border-t border-zinc-800 text-center"></div>
                </div>

                <!-- Live Batsmen and Bowler Figures section -->
                <div id="live-stats-section" class="space-y-4">
                    <!-- Batsmen Table -->
                    <div>
                        <h4 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                            🏏 Live Batting
                        </h4>
                        <div class="table-container bg-zinc-950 border border-zinc-800 rounded-lg">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="border-b border-zinc-800 bg-zinc-900/50 text-zinc-400">
                                        <th class="p-3 font-semibold">Batsman</th>
                                        <th class="p-3 font-mono font-semibold text-center">R</th>
                                        <th class="p-3 font-mono font-semibold text-center">B</th>
                                        <th class="p-3 font-mono font-semibold text-center">4s</th>
                                        <th class="p-3 font-mono font-semibold text-center">6s</th>
                                        <th class="p-3 font-mono font-semibold text-center">SR</th>
                                    </tr>
                                </thead>
                                <tbody id="modal-batsmen-body">
                                    <!-- Dynamic Insertion -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Bowler Table -->
                    <div>
                        <h4 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                            ⚾ Active Bowling
                        </h4>
                        <div class="table-container bg-zinc-950 border border-zinc-800 rounded-lg">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="border-b border-zinc-800 bg-zinc-900/50 text-zinc-400">
                                        <th class="p-3 font-semibold">Bowler</th>
                                        <th class="p-3 font-mono font-semibold text-center">O</th>
                                        <th class="p-3 font-mono font-semibold text-center">M</th>
                                        <th class="p-3 font-mono font-semibold text-center">R</th>
                                        <th class="p-3 font-mono font-semibold text-center">W</th>
                                        <th class="p-3 font-mono font-semibold text-center">ECO</th>
                                    </tr>
                                </thead>
                                <tbody id="modal-bowler-body">
                                    <!-- Dynamic Insertion -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="no-live-stats-msg" class="text-center py-6 bg-zinc-950 border border-zinc-800 rounded-lg text-xs text-zinc-500 hidden">
                    Live player updates are not available for this game state.
                </div>
            </div>
        </div>
    </div>

    <script>
        // RapidAPI Authorization Configuration
        const RAPIDAPI_KEY = "5c86953d66mshe0d3e06701aa1ddp14c43djsn3eac42f75725";
        const RAPIDAPI_HOST = "cricbuzz-cricket.p.rapidapi.com";

        const HEADERS = {
            "Content-Type": "application/json",
            "x-rapidapi-host": RAPIDAPI_HOST,
            "x-rapidapi-key": RAPIDAPI_KEY
        };

        const LIVE_MATCHES_URL = "https://cricbuzz-cricket.p.rapidapi.com/matches/v1/live";
        const UPCOMING_MATCHES_URL = "https://cricbuzz-cricket.p.rapidapi.com/matches/v1/recent";

        let scheduleFetched = false;
        let globalLiveMatchesCache = []; // Global pointer layout storage to reference detailed info on demand

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('text-lime-500', 'border-lime-500', 'font-bold');
                btn.classList.add('text-gray-400', 'border-transparent');
            });

            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.remove('text-gray-400', 'border-transparent');
            activeBtn.classList.add('text-lime-500', 'border-lime-500', 'font-bold');

            if (tabName === 'schedule' && !scheduleFetched) {
                fetchSchedules();
            }
        }

        // 1. Live Feed Fetcher using your RapidAPI Key
        async function fetchLiveScores() {
            const statusEl = document.getElementById('status-message');
            const containerEl = document.getElementById('matches-container');
            const indicatorEl = document.getElementById('refresh-indicator');

            try {
                indicatorEl.innerText = "🔄 Syncing live...";
                const response = await fetch(LIVE_MATCHES_URL, { method: "GET", headers: HEADERS });
                
                if (!response.ok) throw new Error(`HTTP Error Code ${response.status}`);
                const result = await response.json();

                if (!result.typeMatches || result.typeMatches.length === 0) {
                    statusEl.innerHTML = `<p class="text-sm text-zinc-400">🏏 No international or domestic games are live right now.</p>`;
                    return;
                }

                containerEl.innerHTML = '';
                statusEl.classList.add('hidden');
                containerEl.classList.remove('hidden');
                
                // Reset cache storage map array
                globalLiveMatchesCache = [];

                result.typeMatches.forEach(matchTypeGroup => {
                    const matchType = matchTypeGroup.matchType || "International";
                    
                    if (matchTypeGroup.seriesMatches) {
                        matchTypeGroup.seriesMatches.forEach(series => {
                            if (series.seriesAdWrapper && series.seriesAdWrapper.matches) {
                                series.seriesAdWrapper.matches.forEach(matchInfo => {
                                    const m = matchInfo.matchInfo;
                                    const score = matchInfo.matchScore;
                                    if (!m) return;

                                    // Push item into unified storage with explicit match identity key references
                                    globalLiveMatchesCache.push({ matchType, ...matchInfo });
                                    const arrayIndexId = globalLiveMatchesCache.length - 1;

                                    const card = document.createElement('div');
                                    card.className = "bg-zinc-900 border border-zinc-800 hover:border-lime-500/40 rounded-lg p-5 shadow-md flex flex-col justify-between transition-all cursor-pointer transform hover:-translate-y-0.5 active:translate-y-0";
                                    card.setAttribute('onclick', `openScorecardModal(${arrayIndexId})`);

                                    const team1Score = score && score.team1Score ? `${score.team1Score.inngs1.runs}/${score.team1Score.inngs1.wickets || 0} <span class="text-xs text-zinc-500 font-normal">(${score.team1Score.inngs1.overs} ov)</span>` : `<span class="text-xs text-zinc-600">Yet to bat</span>`;
                                    const team2Score = score && score.team2Score ? `${score.team2Score.inngs1.runs}/${score.team2Score.inngs1.wickets || 0} <span class="text-xs text-zinc-500 font-normal">(${score.team2Score.inngs1.overs} ov)</span>` : `<span class="text-xs text-zinc-600">Yet to bat</span>`;

                                    card.innerHTML = `
                                        <div>
                                            <div class="flex justify-between items-center text-[11px] font-bold tracking-wider text-zinc-500 uppercase border-b border-zinc-800 pb-2 mb-3">
                                                <span>${matchType}</span>
                                                <span class="flex items-center gap-1.5 text-rose-500 bg-rose-950/20 px-2 py-0.5 rounded font-mono text-[10px]">
                                                    <span class="w-1.5 h-1.5 bg-rose-500 rounded-full animate-pulse"></span>${m.state || 'LIVE'}
                                                </span>
                                            </div>
                                            <h2 class="text-xs text-zinc-400 line-clamp-1 mb-4 font-medium">${m.seriesName}</h2>
                                            <div class="space-y-3.5 my-2">
                                                <div class="flex justify-between items-center">
                                                    <span class="font-bold text-zinc-200 text-base tracking-tight">${m.team1.teamName}</span>
                                                    <span class="font-mono text-sm font-bold text-zinc-100">${team1Score}</span>
                                                </div>
                                                <div class="flex justify-between items-center">
                                                    <span class="font-bold text-zinc-200 text-base tracking-tight">${m.team2.teamName}</span>
                                                    <span class="font-mono text-sm font-bold text-zinc-100">${team2Score}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="mt-5 pt-3 border-t border-zinc-800/80 flex justify-between items-center text-xs font-semibold text-sky-400 tracking-wide">
                                            <span>👉 ${m.status || 'Match calculations updating...'}</span>
                                            <span class="text-[10px] text-zinc-500 bg-zinc-800 px-2 py-0.5 rounded group-hover:text-white">Stats ➔</span>
                                        </div>
                                    `;
                                    containerEl.appendChild(card);
                                });
                            }
                        });
                    }
                });

                if(containerEl.children.length === 0) {
                     statusEl.innerHTML = `<p class="text-sm text-zinc-400">🏏 No active live matches parsed.</p>`;
                     statusEl.classList.remove('hidden');
                }

                indicatorEl.innerText = "✅ Updated";
            } catch (err) {
                console.error(err);
                indicatorEl.innerText = "❌ Offline";
                statusEl.innerHTML = `<p class="text-xs text-red-500">RapidAPI connection error. Verify your account plan details.</p>`;
            }
        }

        // Open detailed metrics modal
        function openScorecardModal(index) {
            const dataItem = globalLiveMatchesCache[index];
            if (!dataItem) return;

            const m = dataItem.matchInfo;
            const score = dataItem.matchScore;
            const mini = dataItem.miniscore; // real-time live performance properties block from API array

            // Update Basic Metadata layout view
            document.getElementById('modal-match-type').innerText = dataItem.matchType;
            document.getElementById('modal-series-name').innerText = m.seriesName;
            document.getElementById('modal-team1-name').innerText = m.team1.teamName;
            document.getElementById('modal-team2-name').innerText = m.team2.teamName;
            document.getElementById('modal-match-status').innerText = m.status || 'Updating live statistics...';

            // Main score presentation format variables
            document.getElementById('modal-team1-score').innerHTML = score && score.team1Score ? `${score.team1Score.inngs1.runs}/${score.team1Score.inngs1.wickets || 0} <span class="text-xs text-zinc-500">(${score.team1Score.inngs1.overs} ov)</span>` : 'Yet to bat';
            document.getElementById('modal-team2-score').innerHTML = score && score.team2Score ? `${score.team2Score.inngs1.runs}/${score.team2Score.inngs1.wickets || 0} <span class="text-xs text-zinc-500">(${score.team2Score.inngs1.overs} ov)</span>` : 'Yet to bat';

            // Clear dynamic table structures
            const batBody = document.getElementById('modal-batsmen-body');
            const bowlBody = document.getElementById('modal-bowler-body');
            batBody.innerHTML = '';
            bowlBody.innerHTML = '';

            // Check if live player statistics block exist inside configuration instance wrapper
            if (mini && (mini.batBatsman || mini.bowlerStriker)) {
                document.getElementById('live-stats-section').classList.remove('hidden');
                document.getElementById('no-live-stats-msg').classList.add('hidden');

                // 1. Map Striker and Non-Striker information
                const batsmenArray = [];
                if (mini.batBatsman) batsmenArray.push({ ...mini.batBatsman, isStriker: true });
                if (mini.batNonBatsman) batsmenArray.push({ ...mini.batNonBatsman, isStriker: false });

                if (batsmenArray.length > 0) {
                    batsmenArray.forEach(b => {
                        const tr = document.createElement('tr');
                        tr.className = "border-b border-zinc-900 hover:bg-zinc-900/30 text-zinc-200";
                        tr.innerHTML = `
                            <td class="p-3 font-medium">
                                ${b.batName} ${b.isStriker ? '<span class="text-lime-400 font-bold ml-1 text-xs">*</span>' : ''}
                            </td>
                            <td class="p-3 font-mono font-bold text-center text-white">${b.runs || 0}</td>
                            <td class="p-3 font-mono text-center text-zinc-400">${b.balls || 0}</td>
                            <td class="p-3 font-mono text-center text-zinc-500">${b.fourX || 0}</td>
                            <td class="p-3 font-mono text-center text-zinc-500">${b.sixX || 0}</td>
                            <td class="p-3 font-mono text-center text-zinc-400">${b.strikeRate || '0.00'}</td>
                        `;
                        batBody.appendChild(tr);
                    });
                } else {
                    batBody.innerHTML = `<tr><td colspan="6" class="p-3 text-center text-zinc-600">No active batsmen listed</td></tr>`;
                }

                // 2. Map Bowler Data metrics layout view
                const bowlerArray = [];
                if (mini.bowlerStriker) bowlerArray.push({ ...mini.bowlerStriker, isActive: true });
                if (mini.bowlerNonStriker) bowlerArray.push({ ...mini.bowlerNonStriker, isActive: false });

                if (bowlerArray.length > 0) {
                    bowlerArray.forEach(bowl => {
                        const tr = document.createElement('tr');
                        tr.className = "border-b border-zinc-900 hover:bg-zinc-900/30 text-zinc-200";
                        tr.innerHTML = `
                            <td class="p-3 font-medium text-zinc-200">${bowl.bowlName}</td>
                            <td class="p-3 font-mono text-center text-zinc-400">${bowl.overs || '0.0'}</td>
                            <td class="p-3 font-mono text-center text-zinc-500">${bowl.maidens || 0}</td>
                            <td class="p-3 font-mono text-center text-zinc-400">${bowl.runs || 0}</td>
                            <td class="p-3 font-mono font-bold text-center text-rose-400">${bowl.wickets || 0}</td>
                            <td class="p-3 font-mono text-center text-zinc-400">${bowl.economy || '0.00'}</td>
                        `;
                        bowlBody.appendChild(tr);
                    });
                } else {
                    bowlBody.innerHTML = `<tr><td colspan="6" class="p-3 text-center text-zinc-600">No active bowler listed</td></tr>`;
                }

            } else {
                // Hide dynamic table containers and display warning notice flag context banner
                document.getElementById('live-stats-section').classList.add('hidden');
                document.getElementById('no-live-stats-msg').classList.remove('hidden');
            }

            // Reveal modal overlay layout components visually
            document.getElementById('scorecard-modal').classList.remove('hidden');
            document.body.classList.add('overflow-hidden'); // Lock body window layout scroll tracking
        }

        function closeModal() {
            document.getElementById('scorecard-modal').classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
            }

            // 2. Schedule List Fetcher using your RapidAPI Key
        async function fetchSchedules() {
            const statusEl = document.getElementById('schedule-status-message');
            const containerEl = document.getElementById('schedule-container');

            try {
                const response = await fetch(UPCOMING_MATCHES_URL, { method: "GET", headers: HEADERS });
                if (!response.ok) throw new Error("Could not download fixture list.");
                const result = await response.json();

                if (!result.typeMatches) {
                    statusEl.innerHTML = `<p class="text-sm text-amber-400">Failed parsing schedules from RapidAPI.</p>`;
                    return;
                }

                containerEl.innerHTML = '';
                statusEl.classList.add('hidden');
                containerEl.classList.remove('hidden');

                result.typeMatches.forEach(matchTypeGroup => {
                    const matchType = matchTypeGroup.matchType || "Match";
                    if(matchTypeGroup.seriesMatches) {
                        matchTypeGroup.seriesMatches.forEach(series => {
                            if(series.seriesAdWrapper && series.seriesAdWrapper.matches) {
                                series.seriesAdWrapper.matches.forEach(matchInfo => {
                                    const m = matchInfo.matchInfo;
                                    if(!m) return;

                                    const card = document.createElement('div');
                                    card.className = "bg-zinc-900 border border-zinc-800 rounded-lg p-5 flex flex-col justify-between shadow-sm";
                                    
                                    let dateLabel = "Date TBD";
                                    if(m.startDate) {
                                        dateLabel = new Date(parseInt(m.startDate)).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                                    }

                                    card.innerHTML = `
                                        <div>
                                            <div class="flex justify-between items-center text-[10px] font-bold text-zinc-500 uppercase tracking-wide border-b border-zinc-800/60 pb-2 mb-3">
                                                <span>${matchType}</span>
                                                <span class="text-lime-400 font-mono bg-lime-950/20 px-2 py-0.5 rounded">${dateLabel}</span>
                                            </div>
                                            <h3 class="text-sm font-bold text-zinc-200 mb-1">${m.team1.teamName} vs ${m.team2.teamName}</h3>
                                            <p class="text-xs text-zinc-500 mb-4">${m.venueInfo?.ground || 'Venue information not listed'}</p>
                                        </div>
                                        <div class="pt-3 border-t border-zinc-800/50 flex justify-between items-center text-[11px] text-zinc-400 font-medium">
                                            <span class="truncate max-w-[70%]">${m.seriesName}</span>
                                            <span class="text-amber-500 font-semibold bg-amber-950/10 px-1.5 py-0.5 rounded border border-amber-900/20">${m.state || 'Finished'}</span>
                                        </div>
                                    `;
                                    containerEl.appendChild(card);
                                });
                            }
                        });
                    }
                });

                scheduleFetched = true;
            } catch (err) {
                console.error(err);
                statusEl.innerHTML = `<p class="text-xs text-red-400">Error rendering upcoming calendar list via RapidAPI.</p>`;
            }
        }

        // Initialize background sync tracking engine loops
        fetchLiveScores();
        setInterval(fetchLiveScores, 45000); // 45 seconds cadence to respect basic RapidAPI subscription quotas
    </script>
</body>
</html>
