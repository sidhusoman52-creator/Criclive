<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Scores</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .cricket-bg {
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
        }
    </style>
</head>
<body class="cricket-bg min-h-screen text-gray-100 font-sans">

    <header class="bg-gray-900 border-b border-gray-800 py-4 px-6 sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-emerald-400 tracking-wide flex items-center gap-2">
                🏏 Live Cricket Dashboard
            </h1>
            <div class="flex items-center gap-2 text-sm bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700">
                <span class="w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></span>
                <span class="text-gray-300 font-medium">Auto-refreshing</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div id="status-message" class="text-center py-12 max-w-md mx-auto bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-xl">
            <p class="text-xl text-gray-400 animate-pulse">Fetching latest match data...</p>
        </div>

        <div id="matches-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
            </div>
    </main>

    <footer class="text-center py-8 text-gray-500 text-xs border-t border-gray-800 mt-12">
        Powered by Real-time Cricket Data Feed
    </footer>

    <script>
        // Your active API key is now perfectly placed here on line 43!
        const API_KEY = "21ba7825-b668-4ef9-b5ed-91680688b513"; 
        const API_URL = `https://api.cricapi.com/v1/currentMatches?apikey=${API_KEY}`;

        async function fetchScores() {
            const statusEl = document.getElementById('status-message');
            const containerEl = document.getElementById('matches-container');

            try {
                // Safeguard check
                if (API_KEY === "YOUR_ACTUAL_API_KEY_HERE" || API_KEY === "") {
                    statusEl.innerHTML = `
                        <div class="text-amber-400">
                            <p class="text-lg font-bold mb-2">⚠️ Configuration Required</p>
                            <p class="text-sm text-gray-400">Please add your real API key from cricketdata.org into the API_KEY variable.</p>
                        </div>`;
                    return;
                }

                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`Server responded with status ${response.status}`);
                }

                const result = await response.json();

                // Handle API error responses gracefully (e.g. invalid key or hit limit)
                if (result.status !== "success") {
                    statusEl.innerHTML = `
                        <div class="text-red-400">
                            <p class="text-lg font-bold mb-2">❌ API Request Failed</p>
                            <p class="text-sm text-gray-400">${result.reason || 'Check if your API key is correct or if you reached your daily free limit.'}</p>
                        </div>`;
                    return;
                }

                // Handle case where API works but no live matches are active right now
                if (!result.data || result.data.length === 0) {
                    statusEl.innerHTML = `
                        <div class="text-gray-300">
                            <p class="text-lg font-bold mb-2">🏏 No Matches Live</p>
                            <p class="text-sm text-gray-500">There are no live international or domestic matches currently stored in the system. Check back later!</p>
                        </div>`;
                    return;
                }

                // Clear loading text and unhide layout container
                containerEl.innerHTML = '';
                statusEl.classList.add('hidden');
                containerEl.classList.remove('hidden');

                // Loop through live matches and build user interface cards
                result.data.forEach(match => {
                    const matchCard = document.createElement('div');
                    matchCard.className = "bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-xl flex flex-col justify-between hover:border-emerald-500/30 transition-all duration-300";

                    // Safely extract innings info or default to standard text
                    const scoreText1 = match.score && match.score[0] 
                        ? `${match.score[0].inning}: ${match.score[0].r}/${match.score[0].w} (${match.score[0].o} ov)` 
                        : "Yet to bat";
                    const scoreText2 = match.score && match.score[1] 
                        ? `${match.score[1].inning}: ${match.score[1].r}/${match.score[1].w} (${match.score[1].o} ov)` 
                        : "Yet to bat";

                    matchCard.innerHTML = `
                        <div>
                            <div class="flex justify-between items-center mb-4 text-xs font-semibold uppercase tracking-wider text-gray-400 border-b border-gray-800 pb-2">
                                <span>${match.matchType || 'Match'}</span>
                                <span class="text-emerald-400 bg-emerald-950/50 px-2 py-0.5 rounded border border-emerald-800/50">Live</span>
                            </div>
                            <h3 class="text-sm text-gray-400 mb-4 italic font-medium">${match.name}</h3>
                            <div class="space-y-4 my-4">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-lg text-white">${match.teams[0]}</span>
                                    <span class="text-xs bg-gray-800 px-2.5 py-1.5 rounded text-gray-300 font-mono tracking-wide">${scoreText1}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-lg text-white">${match.teams[1]}</span>
                                    <span class="text-xs bg-gray-800 px-2.5 py-1.5 rounded text-gray-300 font-mono tracking-wide">${scoreText2}</span>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4 pt-3 border-t border-gray-800 text-xs font-medium text-amber-400 bg-amber-950/20 p-2.5 rounded border border-amber-900/30">
                            📢 Status: ${match.status || 'Match info updating...'}
                        </div>
                    `;
                    containerEl.appendChild(matchCard);
                });

            } catch (error) {
                console.error("API Fetch Error:", error);
                statusEl.innerHTML = `
                    <div class="text-red-400">
                        <p class="text-lg font-bold mb-1">❌ Network Error</p>
                        <p class="text-xs text-gray-500">${error.message}</p>
                    </div>`;
            }
        }

        // Initialize immediately and run every 30 seconds
        fetchScores();
        setInterval(fetchScores, 30000);
    </script>
</body>
</html>
