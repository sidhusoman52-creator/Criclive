<script>
const API_KEY = "21ba7825-b668-4ef9-b5ed-91680688b513";

const LIVE_API_URL =
`https://api.cricapi.com/v1/currentMatches?apikey=${API_KEY}&offset=0`;

const SCHEDULE_API_URL =
`https://api.cricapi.com/v1/matches?apikey=${API_KEY}&offset=0`;

const SERIES_API_URL =
`https://api.cricapi.com/v1/series?apikey=${API_KEY}&offset=0`;

let scheduleFetched = false;
let seriesDropdownLoaded = false;

/* =========================
   MATCH FILTER SYSTEM
========================= */

function isImportantMatch(match) {

    const name = (match.name || "").toLowerCase();
    const series = (match.series || "").toLowerCase();

    /* IPL */
    const isIPL =
        name.includes("ipl") ||
        series.includes("ipl") ||
        name.includes("indian premier league");

    /* International Teams */
    const internationalTeams = [
        "india", "australia", "england", "pakistan",
        "new zealand", "south africa", "bangladesh",
        "afghanistan", "west indies", "sri lanka",
        "ireland", "zimbabwe"
    ];

    let internationalCount = 0;

    internationalTeams.forEach(team => {
        if (name.includes(team)) {
            internationalCount++;
        }
    });

    const isInternational = internationalCount >= 2;

    /* Women's cricket */
    const isWomen =
        name.includes("women") ||
        name.includes("womens");

    /* Exclude local/domestic small matches */
    const blockedWords = [
        "sub regional",
        "u19",
        "academy",
        "county",
        "domestic",
        "division",
        "league",
        "a team",
        "emerging",
        "qualifier africa",
        "botswana",
        "mali",
        "rwanda",
        "cameroon",
        "sierra leone",
        "ivory coast"
    ];

    const isBlocked = blockedWords.some(word =>
        name.includes(word)
    );

    return (isIPL || isInternational || isWomen) && !isBlocked;
}

/* =========================
   TAB SYSTEM
========================= */

function switchTab(tabName) {

    document.querySelectorAll('.tab-content').forEach(el => {
        el.classList.add('hidden');
    });

    document.querySelectorAll('nav button').forEach(btn => {
        btn.classList.remove(
            'text-lime-500',
            'border-lime-500',
            'font-bold'
        );

        btn.classList.add(
            'text-gray-400',
            'border-transparent'
        );
    });

    document
        .getElementById(`content-${tabName}`)
        .classList.remove('hidden');

    const activeBtn =
        document.getElementById(`tab-${tabName}`);

    activeBtn.classList.remove(
        'text-gray-400',
        'border-transparent'
    );

    activeBtn.classList.add(
        'text-lime-500',
        'border-lime-500',
        'font-bold'
    );

    if (tabName === 'schedule' && !scheduleFetched) {
        fetchSchedules();
    }

    if (tabName === 'tables' && !seriesDropdownLoaded) {
        populateSeriesDropdown();
    }
}

/* =========================
   LIVE MATCHES
========================= */

async function fetchLiveScores() {

    const statusEl =
        document.getElementById('status-message');

    const containerEl =
        document.getElementById('matches-container');

    const indicatorEl =
        document.getElementById('refresh-indicator');

    try {

        indicatorEl.innerText = "🔄 Updating...";

        const response = await fetch(LIVE_API_URL);

        const result = await response.json();

        if (result.status !== "success") {
            statusEl.innerHTML =
            `<p class="text-red-400">
                API Error
            </p>`;
            return;
        }

        /* FILTER IMPORTANT MATCHES */

        const filteredMatches =
            result.data.filter(isImportantMatch);

        if (filteredMatches.length === 0) {

            statusEl.innerHTML =
            `<p class="text-zinc-400">
                No International or IPL matches live now.
            </p>`;

            return;
        }

        containerEl.innerHTML = "";

        statusEl.classList.add("hidden");

        containerEl.classList.remove("hidden");

        filteredMatches.forEach(match => {

            const card = document.createElement("div");

            card.className =
            "bg-zinc-900 border border-zinc-800 rounded-xl p-5";

            const score1 =
                match.score && match.score[0]
                ? `${match.score[0].r}/${match.score[0].w}
                   (${match.score[0].o} ov)`
                : "Yet to bat";

            const score2 =
                match.score && match.score[1]
                ? `${match.score[1].r}/${match.score[1].w}
                   (${match.score[1].o} ov)`
                : "Yet to bat";

            card.innerHTML = `

                <div class="flex justify-between mb-3">

                    <span class="text-xs uppercase text-zinc-500">
                        ${match.matchType || "Match"}
                    </span>

                    <span class="text-rose-500 text-xs font-bold">
                        ● LIVE
                    </span>

                </div>

                <h2 class="text-sm text-zinc-400 mb-4">
                    ${match.name}
                </h2>

                <div class="space-y-4">

                    <div class="flex justify-between">

                        <span class="font-bold text-white">
                            ${match.teams[0]}
                        </span>

                        <span class="font-bold">
                            ${score1}
                        </span>

                    </div>

                    <div class="flex justify-between">

                        <span class="font-bold text-white">
                            ${match.teams[1]}
                        </span>

                        <span class="font-bold">
                            ${score2}
                        </span>

                    </div>

                </div>

                <div class="mt-4 pt-3 border-t border-zinc-800">

                    <span class="text-sky-400 text-xs">
                        ${match.status || ""}
                    </span>

                </div>
            `;

            containerEl.appendChild(card);
        });

        indicatorEl.innerText = "✅ Updated";

    } catch (err) {

        console.log(err);

        indicatorEl.innerText = "❌ Error";

        statusEl.innerHTML =
        `<p class="text-red-400">
            Failed to load live matches.
        </p>`;
    }
}

/* =========================
   SCHEDULES
========================= */

async function fetchSchedules() {

    const statusEl =
        document.getElementById(
            'schedule-status-message'
        );

    const containerEl =
        document.getElementById(
            'schedule-container'
        );

    try {

        const response =
            await fetch(SCHEDULE_API_URL);

        const result = await response.json();

        if (result.status !== "success") {

            statusEl.innerHTML =
            `<p class="text-red-400">
                Failed loading schedules
            </p>`;

            return;
        }

        const upcomingMatches =
            result.data.filter(match =>
                !match.matchStarted &&
                isImportantMatch(match)
            );

        if (upcomingMatches.length === 0) {

            statusEl.innerHTML =
            `<p class="text-zinc-400">
                No upcoming IPL or international matches.
            </p>`;

            return;
        }

        containerEl.innerHTML = "";

        statusEl.classList.add("hidden");

        containerEl.classList.remove("hidden");

        upcomingMatches.slice(0, 20).forEach(match => {

            const card = document.createElement("div");

            card.className =
            "bg-zinc-900 border border-zinc-800 rounded-xl p-5";

            const matchDate = match.date
                ? new Date(match.date)
                    .toLocaleString()
                : "Date TBD";

            card.innerHTML = `

                <div class="flex justify-between mb-3">

                    <span class="text-xs text-zinc-500 uppercase">
                        ${match.matchType}
                    </span>

                    <span class="text-lime-400 text-xs">
                        Upcoming
                    </span>

                </div>

                <h3 class="text-white font-bold mb-2">
                    ${match.name}
                </h3>

                <p class="text-zinc-500 text-sm mb-4">
                    ${match.venue || ""}
                </p>

                <div class="text-xs text-zinc-400">

                    ${matchDate}

                </div>
            `;

            containerEl.appendChild(card);
        });

        scheduleFetched = true;

    } catch (err) {

        console.log(err);

        statusEl.innerHTML =
        `<p class="text-red-400">
            Error loading schedule.
        </p>`;
    }
}

/* =========================
   SERIES DROPDOWN
========================= */

async function populateSeriesDropdown() {

    const dropdown =
        document.getElementById('series-select');

    try {

        const response =
            await fetch(SERIES_API_URL);

        const result = await response.json();

        if (result.status !== "success") return;

        dropdown.innerHTML =
        `<option disabled selected>
            Select Tournament
        </option>`;

        const filteredSeries =
            result.data.filter(series =>
                isImportantMatch({
                    name: series.name
                })
            );

        filteredSeries.forEach(series => {

            const option =
                document.createElement("option");

            option.value = series.id;

            option.innerText = series.name;

            dropdown.appendChild(option);
        });

        seriesDropdownLoaded = true;

    } catch (err) {

        console.log(err);
    }
}

/* =========================
   POINTS TABLE
========================= */

async function handleSeriesChange() {

    const seriesId =
        document.getElementById('series-select').value;

    const tbody =
        document.getElementById('table-body');

    const statusEl =
        document.getElementById('table-status-message');

    const tableContainer =
        document.getElementById('table-data-container');

    try {

        statusEl.classList.remove("hidden");

        tableContainer.classList.add("hidden");

        const response = await fetch(
            `https://api.cricapi.com/v1/series_points?apikey=${API_KEY}&id=${seriesId}`
        );

        const result = await response.json();

        tbody.innerHTML = "";

        if (
            result.status !== "success" ||
            !result.data
        ) {

            statusEl.innerHTML =
            `<p class="text-red-400">
                No points table found.
            </p>`;

            return;
        }

        result.data.forEach(team => {

            const row =
                document.createElement("tr");

            row.innerHTML = `

                <td class="px-4 py-3">
                    ${team.teamname}
                </td>

                <td class="text-center">
                    ${team.matches}
                </td>

                <td class="text-center text-green-400">
                    ${team.wins}
                </td>

                <td class="text-center text-red-400">
                    ${team.loss}
                </td>

                <td class="text-center text-lime-400 font-bold">
                    ${team.points}
                </td>

                <td class="text-right pr-4">
                    ${team.netRunRate}
                </td>
            `;

            tbody.appendChild(row);
        });

        statusEl.classList.add("hidden");

        tableContainer.classList.remove("hidden");

    } catch (err) {

        console.log(err);

        statusEl.innerHTML =
        `<p class="text-red-400">
            Failed loading points table.
        </p>`;
    }
}

/* =========================
   AUTO START
========================= */

fetchLiveScores();

setInterval(fetchLiveScores, 30000);
            </script>
