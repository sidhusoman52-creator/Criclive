<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricbuzz Clone</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .cricbuzz-dark { background-color: #1a1a1a; }
        .cb-nav { background-color: #004f3f; } /* Classic Cricbuzz Green */
        .cb-bg { background-color: #0f1011; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="cb-bg min-h-screen text-gray-100 font-sans">

    <header class="cb-nav text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl font-black tracking-tighter bg-lime-500 text-black px-2 py-0.5 rounded-sm">cricbuzz</span>
                <span class="text-xs font-bold uppercase tracking-widest text-lime-400 border border-lime-400/30 px-1.5 py-0.5 rounded animate-pulse">Live App</span>
            </div>
            <div id="refresh-indicator" class="text-xs text-lime-300 font-mono bg-emerald-900/50 px-2 py-1 rounded border border-emerald-700/30">
                🔄 Syncing live...
            </div>
        </div>
    </header>

    <nav class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex overflow-x-auto font-medium text-sm">
            <button onclick="switchTab('live')" id="tab-live" class="py-3 px-6 border-b-2 border-lime-500 text-lime-500 whitespace-nowrap font-bold transition-all">
                Live Matches
            </button>
            <button onclick="switchTab('schedule')" id="tab-schedule" class="py-3 px-6 border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap transition-all">
                Schedules
            </button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-6">
        <section id="content-live" class="tab-content">
            <div id="status-message" class="text-center py-12 max-w-md mx-auto bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-xl">
                <p class="text-sm text-zinc-400 animate-pulse">Connecting to RapidAPI Cricbuzz stream...</p>
            </div>
            <div id="matches-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden"></div>
        </section>

        <section id="content-schedule" class="tab-content hidden">
            <div id="schedule-status-message" class="text-center py-12 max-w-md mx-auto bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-xl">
                <p class="text-sm text-zinc-400 animate-pulse">Loading upcoming cricket calendar...</p>
            </div>
            <div id="schedule-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden"></div>
        </section>
    </main>

    <div id="match-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex justify-end hidden transition-opacity duration-300">
        <div class="w-full max-w-2xl bg-zinc-900 h-full flex flex-col shadow-2xl border-l border-zinc-800 animate-slide-in">
            <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-950">
                <div>
                    <h2 id="modal-match-title" class="text-sm font-bold text-zinc-100 truncate">Match Scorecard</h2>
                    <p id="modal-match-subtitle" class="text-xs text-lime-400 font-medium mt-0.5">Live Commentary Feed</p>
                </div>
                <button onclick="closeMatchModal()" class="text-zinc-400 hover:text-white bg-zinc-800 hover:bg-zinc-700 p-2 rounded-full transition-all">
                    ✕
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-6" id="modal-scroll-body">
                <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-2">
                    <div class="flex justify-between text-sm font-bold">
                        <span id="modal-team1-name" class="text-zinc-300">---</span>
                        <span id="modal-team1-score" class="font-mono text-zinc-100">---</span>
                    </div>
                    <div class="flex justify-between text-sm font-bold">
                        <span id="modal-team2-name" class="text-zinc-300">---</span>
                        <span id="modal-team2-score" class="font-mono text-zinc-100">---</span>
                    </div>
                    <div id="modal-match-status" class="text-xs text-sky-400 font-semibold pt-1 border-t border-zinc-800/60 mt-2">
                        ---
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Batter Performance</h3>
                    <div class="bg-zinc-950 rounded-xl border border-zinc-800 overflow-hidden text-xs">
                        <table class="w-full text-left">
                            <thead class="bg-zinc-900 text-zinc-400 font-mono text-[11px]">
                                <tr>
                                    <th class="p-3">Batter</th>
                                    <th class="p-3 text-center">R</th>
                                    <th class="p-3 text-center">B</th>
                                    <th class="p-3 text-center">4s</th>
                                    <th class="p-3 text-center">6s</th>
                                    <th class="p-3 text-right">SR</th>
                                </tr>
                            </thead>
                            <tbody id="modal-batsmen-body" class="divide-y divide-zinc-800/50 text-zinc-200">
                                </tbody>
                        </table>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-2">Bowler Performance</h3>
                    <div class="bg-zinc-950 rounded-xl border border-zinc-800 overflow-hidden text-xs">
                        <table class="w-full text-left">
                            <thead class="bg-zinc-900 text-zinc-400 font-mono text-[11px]">
                                <tr>
                                    <th class="p-3">Bowler</th>
                                    <th class="p-3 text-center">O</th>
                                    <th class="p-3 text-center">M</th>
                                    <th class="p-3 text-center">R</th>
                                    <th class="p-3 text-center">W</th>
                                    <th class="p-3 text-right">ECO</th>
                                </tr>
                            </thead>
                            <tbody id="modal-bowlers-body" class="divide-y divide-zinc-800/50 text-zinc-200">
                                </tbody>
                        </table>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-3">Live Ball-by-Ball Commentary</h3>
                    <div id="modal-commentary-timeline" class="space-y-3">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const RAPIDAPI_KEY = "5c86953d66mshe0d3e06701aa1ddp14c43djsn3eac42f75725";
        const RAPIDAPI_HOST = "cricbuzz-cricket.p.rapidapi.com";

        const HEADERS = {
            "Content-Type": "application/json",
            "x-rapidapi-host": RAPIDAPI_HOST,
            "x-rapidapi-key": RAPIDAPI_KEY
        };

        const LIVE_MATCHES_URL = "https://cricbuzz-cricket.p.rapidapi.com/matches/v1/live";
        const UPCOMING_MATCHES_URL = "https://cricbuzz-cricket.p.rapidapi.com/matches/v1/recent";

        let scheduleFetched = false;
        let activeMatchId = null;
        let modalRefreshInterval = null;

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('text-lime-500', 'border-lime-500', 'font-bold');
                btn.classList.add('text-gray-400', 'border-transparent');
            });

            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.remove('text-gray-400', 'border-transparent');
            activeBtn.classList.add('text-lime-500', 'border-lime-500', 'font-bold');

            if (tabName === 'schedule' && !scheduleFetched) {
                fetchSchedules();
            }
        }

        async function fetchLiveScores() {
            const statusEl = document.getElementById('status-message');
            const containerEl = document.getElementById('matches-container');
            const indicatorEl = document.getElementById('refresh-indicator');

            try {
                indicatorEl.innerText = "🔄 Syncing live...";
                const response = await fetch(LIVE_MATCHES_URL, { method: "GET", headers: HEADERS });
                if (!response.ok) throw new Error(`HTTP Error Code ${response.status}`);
                const result = await response.json();

                if (!result.typeMatches || result.typeMatches.length === 0) {
                    statusEl.innerHTML = `<p class="text-sm text-zinc-400">🏏 No international or domestic games are live right now.</p>`;
                    return;
                }

                containerEl.innerHTML = '';
                statusEl.classList.add('hidden');
                containerEl.classList.remove('hidden');

                result.typeMatches.forEach(matchTypeGroup => {
                    const matchType = matchTypeGroup.matchType || "International";
                    if (matchTypeGroup.seriesMatches) {
                        matchTypeGroup.seriesMatches.forEach(series => {
                            if (series.seriesAdWrapper && series.seriesAdWrapper.matches) {
                                series.seriesAdWrapper.matches.forEach(matchInfo => {
                                    const m = matchInfo.matchInfo;
                                    const score = matchInfo.matchScore;
                                    if (!m) return;

                                    const matchId = m.matchId;
                                    const card = document.createElement('div');
                                    card.className = "bg-zinc-900 border border-zinc-800 hover:border-lime-500/50 rounded-lg p-5 shadow-md flex flex-col justify-between transition-all cursor-pointer transform hover:-translate-y-0.5";
                                    card.setAttribute('onclick', `openMatchDetails('${matchId}')`);

                                    const team1Score = score && score.team1Score ? `${score.team1Score.inngs1.runs}/${score.team1Score.inngs1.wickets || 0} <span class="text-xs text-zinc-400 font-normal">(${score.team1Score.inngs1.overs} ov)</span>` : `<span class="text-xs text-zinc-600">Yet to bat</span>`;
                                    const team2Score = score && score.team2Score ? `${score.team2Score.inngs1.runs}/${score.team2Score.inngs1.wickets || 0} <span class="text-xs text-zinc-400 font-normal">(${score.team2Score.inngs1.overs} ov)</span>` : `<span class="text-xs text-zinc-600">Yet to bat</span>`;

                                    card.innerHTML = `
                                        <div>
                                            <div class="flex justify-between items-center text-[11px] font-bold tracking-wider text-zinc-500 uppercase border-b border-zinc-800 pb-2 mb-3">
                                                <span>${matchType}</span>
                                                <span class="flex items-center gap-1.5 text-rose-500 bg-rose-950/20 px-2 py-0.5 rounded font-mono text-[10px]">
                                                    <span class="w-1.5 h-1.5 bg-rose-500 rounded-full animate-pulse"></span>${m.state || 'LIVE'}
                                                </span>
                                            </div>
                                            <h2 class="text-xs text-zinc-400 line-clamp-1 mb-4 font-medium">${m.seriesName}</h2>
                                            <div class="space-y-3.5 my-2">
                                                <div class="flex justify-between items-center">
                                                    <span class="font-bold text-zinc-200 text-base tracking-tight">${m.team1.teamName}</span>
                                                    <span class="font-mono text-sm font-bold text-zinc-100">${team1Score}</span>
                                                </div>
                                                <div class="flex justify-between items-center">
                                                    <span class="font-bold text-zinc-200 text-base tracking-tight">${m.team2.teamName}</span>
                                                    <span class="font-mono text-sm font-bold text-zinc-100">${team2Score}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="mt-5 pt-3 border-t border-zinc-800/80 text-xs font-semibold text-sky-400 tracking-wide flex justify-between items-center">
                                            <span>👉 ${m.status || 'Match updating...'}</span>
                                            <span class="text-[11px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded hover:bg-lime-500 hover:text-black transition-colors">Stats ➔</span>
                                        </div>
                                    `;
                                    containerEl.appendChild(card);
                                });
                            }
                        });
                    }
                });

                indicatorEl.innerText = "✅ Updated";
            } catch (err) {
                console.error(err);
                indicatorEl.innerText = "❌ Offline";
            }
        }

        // FETCH EXPLICIT SCORECARD + COMMENTARY METRICS DATA MATRIX
        async function openMatchDetails(matchId) {
            activeMatchId = matchId;
            document.getElementById('match-modal').classList.remove('hidden');
            document.body.classList.add('overflow-hidden'); // Hold background page scrolling

            // Clear legacy data items from modal framework
            document.getElementById('modal-batsmen-body').innerHTML = `<tr><td colspan="6" class="p-4 text-center text-zinc-500 animate-pulse">Loading Live Batting Metrics...</td></tr>`;
            document.getElementById('modal-bowlers-body').innerHTML = `<tr><td colspan="6" class="p-4 text-center text-zinc-500 animate-pulse">Loading Live Bowling Figures...</td></tr>`;
            document.getElementById('modal-commentary-timeline').innerHTML = `<p class="text-xs text-zinc-500 text-center py-4 animate-pulse">Connecting to ball-by-ball wire...</p>`;

            // Pull full dataset instantly
            await updateModalData();

            // Establish precise micro-sync interval loops (15s cadence for live scoreboard metrics)
            clearInterval(modalRefreshInterval);
            modalRefreshInterval = setInterval(updateModalData, 15000);
        }

        async function updateModalData() {
            if (!activeMatchId) return;

            const HSCARD_URL = `https://cricbuzz-cricket.p.rapidapi.com/mcenter/v1/${activeMatchId}/hscard`;
            const COMM_URL = `https://cricbuzz-cricket.p.rapidapi.com/mcenter/v1/${activeMatchId}/commentary`;

            try {
                // Parallel fetching logic for optimization
                const [scorecardRes, commentaryRes] = await Promise.all([
                    fetch(HSCARD_URL, { method: "GET", headers: HEADERS }),
                    fetch(COMM_URL, { method: "GET", headers: HEADERS })
                ]);

                if (scorecardRes.ok) {
                    const scData = await scorecardRes.json();
                    renderModalScorecard(scData);
                }
                if (commentaryRes.ok) {
                    const commData = await commentaryRes.json();
                    renderModalCommentary(commData);
                }
            } catch (err) {
                console.error("Modal Engine Fetch Fault:", err);
            }
        }

        function renderModalScorecard(data) {
            if (!data) return;
            
            // Map header status rows
            document.getElementById('modal-match-title').innerText = data.matchHeader?.seriesName || "Live Performance Tracker";
            document.getElementById('modal-match-status').innerText = `👉 ${data.status || 'Match live in progress'}`;

            document.getElementById('modal-team1-name').innerText = data.miniscore?.teamsMiniScore?.[0]?.teamName || "Team 1";
            document.getElementById('modal-team1-score').innerText = data.miniscore?.teamsMiniScore?.[0]?.score || "Yet to bat";
            
            document.getElementById('modal-team2-name').innerText = data.miniscore?.teamsMiniScore?.[1]?.teamName || "Team 2";
            document.getElementById('modal-team2-score').innerText = data.miniscore?.teamsMiniScore?.[1]?.score || "Yet to bat";

            // Process Active Batsmen Lines safely
            const batsBody = document.getElementById('modal-batsmen-body');
            batsBody.innerHTML = '';
            const batsList = data.miniscore?.batsman || [];

            if(batsList.length === 0) {
                batsBody.innerHTML = `<tr><td colspan="6" class="p-3 text-center text-zinc-500">Innings data initializing...</td></tr>`;
            } else {
                batsList.forEach(b => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-zinc-900 border-b border-zinc-800/40";
                    row.innerHTML = `
                        <td class="p-3 font-bold text-zinc-100">${b.name} ${b.isStriker ? '<span class="text-lime-400 font-mono text-[10px] ml-1">★</span>' : ''}</td>
                        <td class="p-3 text-center font-mono font-bold">${b.runs || 0}</td>
                        <td class="p-3 text-center text-zinc-400 font-mono">${b.balls || 0}</td>
                        <td class="p-3 text-center text-zinc-400 font-mono">${b.fours || 0}</td>
                        <td class="p-3 text-center text-zinc-400 font-mono">${b.sixes || 0}</td>
                        <td class="p-3 text-right text-zinc-400 font-mono">${b.strikeRate || '0.00'}</td>
                    `;
                    batsBody.appendChild(row);
                });
            }

            // Process Active Bowler Lines safely
            const bowlBody = document.getElementById('modal-bowlers-body');
            bowlBody.innerHTML = '';
            const bowlList = data.miniscore?.bowler || [];

            if(bowlList.length === 0) {
                bowlBody.innerHTML = `<tr><td colspan="6" class="p-3 text-center text-zinc-500">Bowlers taking run-ups...</td></tr>`;
            } else {
                bowlList.forEach(b => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-zinc-900 border-b border-zinc-800/40";
                    row.innerHTML = `
                        <td class="p-3 font-bold text-zinc-100">${b.name}</td>
                        <td class="p-3 text-center font-mono">${b.overs || '0'}</td>
                        <td class="p-3 text-center
