<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cricbuzz Clone</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background: #0f1011;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }
        .cb-nav {
            background: #005c46;
        }
        .tab-btn {
            padding: 16px 20px;
            color: #a1a1aa;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
        }
        .tab-active {
            color: #84cc16;
            border-bottom-color: #84cc16;
        }
        .match-card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.22);
        }
        .live-dot {
            width: 10px;
            height: 10px;
            background: #ff1d25;
            border-radius: 9999px;
            animation: pulse 1.1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <header class="cb-nav shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-lime-500 text-black px-3 py-1 rounded font-black text-xl">
                    cricbuzz
                </div>
                <div class="text-lime-400 text-xs font-bold uppercase tracking-widest">
                    LIVE
                </div>
            </div>
            <div id="refresh-status" class="text-xs text-lime-300 font-semibold">
                Updated
            </div>
        </div>
    </header>

    <nav class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex overflow-x-auto">
            <button id="live-tab" class="tab-btn tab-active" onclick="switchTab('live')">
                Live Matches
            </button>
            <button id="schedule-tab" class="tab-btn" onclick="switchTab('schedule')">
                Upcoming Matches
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <section id="live-section">
            <div id="live-loading" class="text-center text-zinc-400 py-10">
                Loading live matches...
            </div>
            <div id="live-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden"></div>
        </section>

        <section id="schedule-section" class="hidden">
            <div id="schedule-loading" class="text-center text-zinc-400 py-10">
                Loading upcoming matches...
            </div>
            <div id="schedule-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden"></div>
        </section>
    </main>

    <script>
        const API_KEY = "21ba7825-b668-4ef9-b5ed-91680688b513";

        const LIVE_API =
            `https://api.cricapi.com/v1/currentMatches?apikey=${API_KEY}&offset=0`;

        const SCHEDULE_API =
            `https://api.cricapi.com/v1/matches?apikey=${API_KEY}&offset=0`;

        const IPL_TEAMS = [
            "chennai super kings", "csk",
            "mumbai indians", "mi",
            "royal challengers bengaluru", "royal challengers bangalore", "rcb",
            "kolkata knight riders", "kkr",
            "delhi capitals", "dc",
            "punjab kings", "pbks",
            "rajasthan royals", "rr",
            "sunrisers hyderabad", "srh",
            "gujarat titans", "gt",
            "lucknow super giants", "lsg"
        ];

        const NATIONAL_TEAMS = [
            "india", "australia", "england", "pakistan", "new zealand",
            "south africa", "sri lanka", "bangladesh", "afghanistan",
            "west indies", "ireland", "zimbabwe", "netherlands",
            "scotland", "nepal", "oman", "uae", "united arab emirates",
            "usa", "united states", "canada", "namibia",
            "hong kong", "papua new guinea"
        ];

        const BLOCKED_DOMESTIC_WORDS = [
            "county",
            "blast league",
            "league two",
            "sub regional",
            "regional",
            "domestic",
            "academy",
            "u19",
            "under 19",
            "under-19",
            "u-19",
            "division",
            "plate group",
            "plate final",
            "ranji",
            "vijay hazare",
            "syed mushtaq",
            "duleep",
            "duleep",
            "smat",
            "cpl",
            "super smash",
            "the hundred",
            "women's t20 blast",
            "womens t20 blast",
            "t20 blast",
            "blast league two",
            "inter state",
            "club",
            "school",
            "college"
        ];

        function normalizeText(value) {
            return (value || "").toString().toLowerCase();
        }

        function getMatchText(match) {
            const parts = [
                match?.name,
                match?.series,
                match?.matchType,
                ...(Array.isArray(match?.teams) ? match.teams : [])
            ];
            return normalizeText(parts.filter(Boolean).join(" "));
        }

        function hasBlockedDomesticWords(text) {
            return BLOCKED_DOMESTIC_WORDS.some(word => text.includes(word));
        }

        function isIPLMatch(text) {
            if (text.includes("ipl") || text.includes("indian premier league")) {
                return true;
            }
            return IPL_TEAMS.some(team => text.includes(team));
        }

        function countNationalTeamHits(text) {
            let count = 0;
            for (const team of NATIONAL_TEAMS) {
                if (text.includes(team)) {
                    count += 1;
                }
            }
            return count;
        }

        function isInternationalMatch(text) {
            const teamHits = countNationalTeamHits(text);

            const internationalCompetitionWords = [
                "icc",
                "world cup",
                "champions trophy",
                "asia cup",
                "t20i",
                "odi",
                "test",
                "tour of",
                "bilateral",
                "tri-series",
                "tri series",
                "international"
            ];

            const hasCompetitionWord = internationalCompetitionWords.some(word => text.includes(word));

            return teamHits >= 2 || (teamHits >= 1 && hasCompetitionWord);
        }

        function isDesiredMatch(match) {
            if (!match) return false;

            const text = getMatchText(match);

            if (!text) return false;

            if (hasBlockedDomesticWords(text)) return false;

            if (isIPLMatch(text)) return true;

            if (isInternationalMatch(text)) return true;

            return false;
        }

        function switchTab(tab) {
            const liveSection = document.getElementById("live-section");
            const scheduleSection = document.getElementById("schedule-section");
            const liveTab = document.getElementById("live-tab");
            const scheduleTab = document.getElementById("schedule-tab");

            liveSection.classList.add("hidden");
            scheduleSection.classList.add("hidden");
            liveTab.classList.remove("tab-active");
            scheduleTab.classList.remove("tab-active");

            if (tab === "live") {
                liveSection.classList.remove("hidden");
                liveTab.classList.add("tab-active");
            } else {
                scheduleSection.classList.remove("hidden");
                scheduleTab.classList.add("tab-active");
            }
        }

        function safeScore(scoreObj) {
            if (!scoreObj) return "Yet to bat";
            const runs = scoreObj.r ?? "-";
            const wickets = scoreObj.w ?? "-";
            const overs = scoreObj.o ?? "-";
            return `${runs}/${wickets} (${overs} ov)`;
        }

        async function loadLiveMatches() {
            const loading = document.getElementById("live-loading");
            const container = document.getElementById("live-container");
            const refresh = document.getElementById("refresh-status");

            try {
                refresh.innerText = "Updating...";

                const response = await fetch(LIVE_API);
                const result = await response.json();

                console.log("LIVE RESULT:", result);

                if (result.status !== "success" || !Array.isArray(result.data)) {
                    loading.innerHTML = "Failed to load live matches";
                    return;
                }

                const matches = result.data.filter(isDesiredMatch);

                if (matches.length === 0) {
                    loading.innerHTML = "No IPL or international matches live right now";
                    return;
                }

                container.innerHTML = "";
                loading.classList.add("hidden");
                container.classList.remove("hidden");

                matches.forEach(match => {
                    const team1 = match?.teams?.[0] || "Team 1";
                    const team2 = match?.teams?.[1] || "Team 2";
                    const score1 = safeScore(match?.score?.[0]);
                    const score2 = safeScore(match?.score?.[1]);

                    const card = document.createElement("div");
                    card.className = "match-card";

                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-3">
                            <div class="text-xs uppercase text-zinc-500 font-bold">
                                ${match.matchType || "Match"}
                            </div>
                            <div class="flex items-center gap-2 text-red-500 text-xs font-bold">
                                <div class="live-dot"></div>
                                LIVE
                            </div>
                        </div>

                        <div class="text-sm text-zinc-400 mb-5 leading-relaxed">
                            ${match.name || ""}
                        </div>

                        <div class="space-y-4">
                            <div class="flex justify-between gap-3">
                                <div class="font-bold text-white text-base">
                                    ${team1}
                                </div>
                                <div class="font-bold text-white text-base text-right">
                                    ${score1}
                                </div>
                            </div>

                            <div class="flex justify-between gap-3">
                                <div class="font-bold text-white text-base">
                                    ${team2}
                                </div>
                                <div class="font-bold text-white text-base text-right">
                                    ${score2}
                                </div>
                            </div>
                        </div>

                        <div class="border-t border-zinc-800 mt-5 pt-3 text-sky-400 text-sm">
                            ${match.status || ""}
                        </div>
                    `;

                    container.appendChild(card);
                });

                refresh.innerText = "Updated";
            } catch (error) {
                console.log(error);
                loading.innerHTML = "Error loading live matches";
                refresh.innerText = "Error";
            }
        }

        async function loadUpcomingMatches() {
            const loading = document.getElementById("schedule-loading");
            const container = document.getElementById("schedule-container");

            try {
                const response = await fetch(SCHEDULE_API);
                const result = await response.json();

                console.log("SCHEDULE RESULT:", result);

                if (result.status !== "success" || !Array.isArray(result.data)) {
                    loading.innerHTML = "Failed to load upcoming matches";
                    return;
                }

                const matches = result.data.filter(match => {
                    const text = getMatchText(match);
                    return !match?.matchStarted && isDesiredMatch(match) && text;
                });

                if (matches.length === 0) {
                    loading.innerHTML = "No upcoming IPL or international matches";
                    return;
                }

                container.innerHTML = "";
                loading.classList.add("hidden");
                container.classList.remove("hidden");

                matches.slice(0, 20).forEach(match => {
                    const card = document.createElement("div");
                    card.className = "match-card";

                    const dateText = match?.date
                        ? new Date(match.date).toLocaleString()
                        : "Date not available";

                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-3">
                            <div class="text-xs uppercase text-zinc-500 font-bold">
                                ${match.matchType || "Match"}
                            </div>
                            <div class="text-lime-400 text-xs font-bold">
                                UPCOMING
                            </div>
                        </div>

                        <div class="font-bold text-white text-base mb-3 leading-relaxed">
                            ${match.name || ""}
                        </div>

                        <div class="text-zinc-400 text-sm mb-2">
                            ${dateText}
                        </div>

                        <div class="text-zinc-500 text-xs">
                            ${match.venue || ""}
                        </div>
                    `;

                    container.appendChild(card);
                });
            } catch (error) {
                console.log(error);
                loading.innerHTML = "Error loading upcoming matches";
            }
        }

        loadLiveMatches();
        loadUpcomingMatches();

        setInterval(loadLiveMatches, 30000);
    </script>
</body>
</html>
