<script>
    const RAPIDAPI_KEY = "5c86953d66mshe0d3e06701aa1ddp14c43djsn3eac42f75725";
    const RAPIDAPI_HOST = "cricbuzz-cricket.p.rapidapi.com";
    const HEADERS = { "Content-Type": "application/json", "x-rapidapi-host": RAPIDAPI_HOST, "x-rapidapi-key": RAPIDAPI_KEY };

    const LIVE_MATCHES_URL = "https://cricbuzz-cricket.p.rapidapi.com/matches/v1/live";
    const UPCOMING_MATCHES_URL = "https://cricbuzz-cricket.p.rapidapi.com/matches/v1/recent";

    let scheduleFetched = false;
    let globalLiveMatchesCache = [];
    let currentlySelectedMatchIndex = null;

    function switchMainTab(tabName) {
        document.querySelectorAll('.main-tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('nav > div > button').forEach(btn => {
            btn.classList.remove('text-lime-500', 'border-lime-500', 'font-bold');
            btn.classList.add('text-gray-400', 'border-transparent');
        });

        document.getElementById(`content-${tabName}`).classList.remove('hidden');
        const activeBtn = document.getElementById(`tab-${tabName}`);
        activeBtn.classList.remove('text-gray-400', 'border-transparent');
        activeBtn.classList.add('text-lime-500', 'border-lime-500', 'font-bold');

        if (tabName === 'schedule' && !scheduleFetched) fetchSchedules();
    }

    function switchSubTab(subTabName) {
        document.querySelectorAll('.sub-tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('#detailed-match-view button[id^="subtab-"]').forEach(btn => {
            btn.classList.remove('text-lime-500', 'border-lime-500');
            btn.classList.add('text-gray-400', 'border-transparent');
        });

        document.getElementById(`subcontent-${subTabName}`).classList.remove('hidden');
        const activeSubBtn = document.getElementById(`subtab-${subTabName}`);
        activeSubBtn.classList.remove('text-gray-400', 'border-transparent');
        activeSubBtn.classList.add('text-lime-500', 'border-lime-500');
    }

    // SAFE SCORE PARSER: Prevents crashes if an innings is complete or missing keys
    function getFormattedScore(teamScoreObj) {
        if (!teamScoreObj) return `<span class="text-xs text-zinc-600">Yet to bat</span>`;
        
        // Check structural variations across different innings states
        const innings = teamScoreObj.inngs1 || teamScoreObj.inngs2;
        if (!innings) return `<span class="text-xs text-zinc-600">Yet to bat</span>`;
        
        const runs = innings.runs ?? 0;
        const wickets = innings.wickets ?? 10; // If all out, wickets might be omitted or set to 10
        const overs = innings.overs ?? 0;
        
        return `${runs}/${wickets} <span class="text-xs text-zinc-500">(${overs} ov)</span>`;
    }

    async function fetchLiveScores() {
        const statusEl = document.getElementById('status-message');
        const containerEl = document.getElementById('matches-container');
        const indicatorEl = document.getElementById('refresh-indicator');

        try {
            indicatorEl.innerText = "🔄 Syncing...";
            const response = await fetch(LIVE_MATCHES_URL, { method: "GET", headers: HEADERS });
            if (!response.ok) throw new Error(`HTTP Error Code ${response.status}`);
            const result = await response.json();

            if (!result.typeMatches || result.typeMatches.length === 0) {
                statusEl.innerHTML = `<p class="text-sm text-zinc-400">🏏 No matches are running live right now.</p>`;
                return;
            }

            containerEl.innerHTML = '';
            globalLiveMatchesCache = [];

            result.typeMatches.forEach(matchTypeGroup => {
                const matchType = matchTypeGroup.matchType || "International";
                if (matchTypeGroup.seriesMatches) {
                    matchTypeGroup.seriesMatches.forEach(series => {
                        if (series.seriesAdWrapper && series.seriesAdWrapper.matches) {
                            series.seriesAdWrapper.matches.forEach(matchInfo => {
                                const m = matchInfo.matchInfo;
                                const score = matchInfo.matchScore;
                                if (!m) return;

                                globalLiveMatchesCache.push({ matchType, ...matchInfo });
                                const arrayIndexId = globalLiveMatchesCache.length - 1;

                                // Utilizing our new safe score parser wrapper functions
                                const team1Score = score ? getFormattedScore(score.team1Score) : `<span class="text-xs text-zinc-600">Yet to bat</span>`;
                                const team2Score = score ? getFormattedScore(score.team2Score) : `<span class="text-xs text-zinc-600">Yet to bat</span>`;

                                const card = document.createElement('div');
                                card.className = "bg-zinc-900 border border-zinc-800 hover:border-lime-500/40 rounded-lg p-5 shadow-md flex flex-col justify-between cursor-pointer transition-all transform hover:-translate-y-0.5";
                                card.setAttribute('onclick', `openMatchDetailsPanel(${arrayIndexId})`);

                                card.innerHTML = `
                                    <div>
                                        <div class="flex justify-between items-center text-[11px] font-bold tracking-wider text-zinc-500 uppercase border-b border-zinc-800 pb-2 mb-3">
                                            <span>${matchType}</span>
                                            <span class="flex items-center gap-1.5 text-rose-500 bg-rose-950/20 px-2 py-0.5 rounded font-mono text-[10px]">
                                                <span class="w-1.5 h-1.5 bg-rose-500 rounded-full animate-pulse"></span>${m.state || 'LIVE'}
                                            </span>
                                        </div>
                                        <h2 class="text-xs text-zinc-400 line-clamp-1 mb-4">${m.seriesName}</h2>
                                        <div class="space-y-3.5 my-2">
                                            <div class="flex justify-between items-center">
                                                <span class="font-bold text-zinc-200 text-base tracking-tight">${m.team1.teamName}</span>
                                                <span class="font-mono text-sm font-bold text-zinc-100">${team1Score}</span>
                                            </div>
                                            <div class="flex justify-between items-center">
                                                <span class="font-bold text-zinc-200 text-base tracking-tight">${m.team2.teamName}</span>
                                                <span class="font-mono text-sm font-bold text-zinc-100">${team2Score}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mt-5 pt-3 border-t border-zinc-800/80 flex justify-between items-center text-xs font-semibold text-sky-400">
                                        <span class="truncate max-w-[85%]">👉 ${m.status || 'Updating...'}</span>
                                        <span class="text-[10px] text-zinc-500 bg-zinc-800 px-1.5 py-0.5 rounded">View Center ➔</span>
                                    </div>
                                `;
                                containerEl.appendChild(card);
                                
                            });
                        }
                    });
                }
            });

            // Clean up view states upon successful parsing loop completion
            statusEl.classList.add('hidden');
            containerEl.classList.remove('hidden');
            indicatorEl.innerText = "✅ Updated";

            if (currentlySelectedMatchIndex !== null) {
                updateDetailFields(currentlySelectedMatchIndex);
            }
        } catch (err) {
            console.error("Data fetch crash bypassed successfully:", err);
            indicatorEl.innerText = "❌ Parse Error";
            statusEl.innerHTML = `<p class="text-sm text-red-400">Error rendering match layout blocks. Retrying sync shortly...</p>`;
        }
    }

    function openMatchDetailsPanel(index) {
        currentlySelectedMatchIndex = index;
        updateDetailFields(index);
        const viewPanel = document.getElementById('detailed-match-view');
        viewPanel.classList.remove('hidden');
        viewPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        switchSubTab('scorecard');
    }

    function updateDetailFields(index) {
        const dataItem = globalLiveMatchesCache[index];
        if (!dataItem) return;

        const m = dataItem.matchInfo;
        const score = dataItem.matchScore;
        const mini = dataItem.miniscore;

        document.getElementById('detail-match-type').innerText = dataItem.matchType;
        document.getElementById('detail-series-name').innerText = m.seriesName;
        document.getElementById('detail-team1-name').innerText = m.team1.teamName;
        document.getElementById('detail-team2-name').innerText = m.team2.teamName;
        document.getElementById('detail-match-status').innerText = m.status || 'Evaluating fields...';

        document.getElementById('detail-team1-score').innerHTML = score ? getFormattedScore(score.team1Score) : 'Yet to bat';
        document.getElementById('detail-team2-score').innerHTML = score ? getFormattedScore(score.team2Score) : 'Yet to bat';

        document.getElementById('detail-venue-ground').innerText = m.venueInfo?.ground || 'Unavailable';
        document.getElementById('detail-venue-city').innerText = m.venueInfo?.city || 'Unavailable';

        const batBody = document.getElementById('detail-batsmen-body');
        const bowlBody = document.getElementById('detail-bowler-body');
        batBody.innerHTML = '';
        bowlBody.innerHTML = '';

        if (mini && (mini.batBatsman || mini.bowlerStriker)) {
            document.getElementById('detail-no-stats-msg').classList.add('hidden');
            
            const batsmenArray = [];
            if (mini.batBatsman) batsmenArray.push({ ...mini.batBatsman, isStriker: true });
            if (mini.batNonBatsman) batsmenArray.push({ ...mini.batNonBatsman, isStriker: false });

            batsmenArray.forEach(b => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-zinc-900 text-zinc-200 text-center hover:bg-zinc-900/30";
                tr.innerHTML = `
                    <td class="p-3 font-medium text-left text-zinc-100">${b.batName} ${b.isStriker ? '<span class="text-lime-400 font-bold ml-1">*</span>' : ''}</td>
                    <td class="p-3 font-mono font-bold text-white">${b.runs || 0}</td>
                    <td class="p-3 font-mono text-zinc-400">${b.balls || 0}</td>
                    <td class="p-3 font-mono text-zinc-500">${b.fourX || 0}</td>
                    <td class="p-3 font-mono text-zinc-500">${b.sixX || 0}</td>
                    <td class="p-3 font-mono text-zinc-400">${b.strikeRate || '0.0'}</td>
                `;
                batBody.appendChild(tr);
            });

            const bowlerArray = [];
            if (mini.bowlerStriker) bowlerArray.push(mini.bowlerStriker);
            if (mini.bowlerNonStriker) bowlerArray.push(mini.bowlerNonStriker);

            bowlerArray.forEach(bowl => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-zinc-900 text-zinc-200 text-center hover:bg-zinc-900/30";
                tr.innerHTML = `
                    <td class="p-3 font-medium text-left text-zinc-100">${bowl.bowlName}</td>
                    <td class="p-3 font-mono text-zinc-400">${bowl.overs || '0.0'}</td>
                    <td class="p-3 font-mono text-zinc-500">${bowl.maidens || 0}</td>
                    <td class="p-3 font-mono text-zinc-400">${bowl.runs || 0}</td>
                    <td class="p-3 font-mono font-bold text-rose-400">${bowl.wickets || 0}</td>
                    <td class="p-3 font-mono text-zinc-400">${bowl.economy || '0.0'}</td>
                `;
                bowlBody.appendChild(tr);
            });
        } else {
            document.getElementById('detail-no-stats-msg').classList.remove('hidden');
        }
    }

    function closeDetailView() {
        document.getElementById('detailed-match-view').classList.add('hidden');
        currentlySelectedMatchIndex = null;
    }

    async function fetchSchedules() {
        const statusEl = document.getElementById('schedule-status-message');
        const containerEl = document.getElementById('schedule-container');
        try {
            const response = await fetch(UPCOMING_MATCHES_URL, { method: "GET", headers: HEADERS });
            const result = await response.json();
            if (!result.typeMatches) return;

            containerEl.innerHTML = '';
            statusEl.classList.add('hidden');
            containerEl.classList.remove('hidden');

            result.typeMatches.forEach(matchTypeGroup => {
                const matchType = matchTypeGroup.matchType || "Match";
                if(matchTypeGroup.seriesMatches) {
                    matchTypeGroup.seriesMatches.forEach(series => {
                        if(series.seriesAdWrapper && series.seriesAdWrapper.matches) {
                            series.seriesAdWrapper.matches.forEach(matchInfo => {
                                const m = matchInfo.matchInfo;
                                if(!m) return;

                                const card = document.createElement('div');
                                card.className = "bg-zinc-900 border border-zinc-800 rounded-lg p-5 flex flex-col justify-between shadow-sm";
                                let dateLabel = m.startDate ? new Date(parseInt(m.startDate)).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : "TBD";

                                card.innerHTML = `
                                    <div>
                                        <div class="flex justify-between items-center text-[10px] font-bold text-zinc-500 uppercase tracking-wide border-b border-zinc-800/60 pb-2 mb-3">
                                            <span>${matchType}</span>
                                            <span class="text-lime-400 font-mono bg-lime-950/20 px-2 py-0.5 rounded">${dateLabel}</span>
                                        </div>
                                        <h3 class="text-sm font-bold text-zinc-200 mb-1">${m.team1.teamName} vs ${m.team2.teamName}</h3>
                                        <p class="text-xs text-zinc-500 mb-4">${m.venueInfo?.ground || 'Venue unlisted'}</p>
                                    </div>
                                    <div class="pt-3 border-t border-zinc-800/50 flex justify-between items-center text-[11px] text-zinc-400 font-medium">
                                        <span class="truncate max-w-[70%]">${m.seriesName}</span>
                                        <span class="text-amber-500 font-semibold bg-amber-950/10 px-1.5 py-0.5 rounded border border-amber-900/20">${m.state || 'Finished'}</span>
                                    </div>
                                `;
                                containerEl.appendChild(card);
                            });
                        }
                    });
                }
            });
            scheduleFetched = true;
        } catch (err) { console.error(err); }
    }

    fetchLiveScores();
    setInterval(fetchLiveScores, 45000);
                </script>
